name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lab
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d lab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # API tests against a real PostgreSQL (a throwaway schema is created)
      - run: python tests/test_api.py
        working-directory: backend
        env:
          DATABASE_URL: postgresql://lab:lab@localhost:5432/lab

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # the runners against real Pyodide and real SQLite
      - run: npm run test:python
      - run: npm run test:sql
      - run: npm run test:js
      # every solution and starter of every course
      - run: npm run check-content
      - run: npm run build
