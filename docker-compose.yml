name: tolie-lab

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/setup.sh first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 384m
    logging: *logging

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lab:${POSTGRES_PASSWORD}@db:5432/lab
      LAB_SECRET_KEY: ${LAB_SECRET_KEY:?Run deploy/setup.sh first}
      LAB_SITE_URL: ${LAB_SITE_URL:-https://lab.tolie.space}
      LAB_CONTENT_DIR: /content
      LAB_EMAIL_VERIFICATION: ${LAB_EMAIL_VERIFICATION:-0}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      LAB_TIMEZONE: ${LAB_TIMEZONE:-Asia/Jakarta}
    volumes:
      # Course content lives in the repo. git pull + `docker compose restart api` loads changes.
      - ./content:/content:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 384m
    logging: *logging

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Only reachable from the droplet itself. Caddy forwards the public domain here.
    ports:
      - "127.0.0.1:8789:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 96m
    logging: *logging

volumes:
  pgdata:
