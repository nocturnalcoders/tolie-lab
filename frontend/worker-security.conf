# The Python and SQL workers run the learner's code, so their policy is the strictest that still
# lets Pyodide and sql.js work: it may only load files from this site, and it may talk only to this site.
# 'wasm-unsafe-eval' lets it compile WebAssembly; Pyodide's runtime also uses eval internally.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; connect-src 'self'; base-uri 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
