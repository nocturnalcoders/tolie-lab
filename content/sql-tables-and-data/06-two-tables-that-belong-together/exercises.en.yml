- slug: customers-and-their-orders
  type: code
  title: Customers and their orders
  prompt: |
    The `customers` table and its three customers are already written in the editor. Complete it with two things.

    **1.** Create the `orders` table with these columns, in this order:

    - `id`: `INTEGER PRIMARY KEY`
    - `customer_id`: `INTEGER`, a foreign key to `customers(id)`
    - `item`: `TEXT`
    - `quantity`: `INTEGER`

    **2.** Fill the `orders` table with these five rows. What goes into `customer_id` is the `id` of the person who ordered, not their name:

    | id | ordered by | item | quantity |
    |---|---|---|---|
    | 1 | Sari | Milk Coffee | 2 |
    | 2 | Budi | Toast | 1 |
    | 3 | Budi | Black Coffee | 1 |
    | 4 | Dewi | Pulled Tea | 3 |
    | 5 | Sari | Banana Fritters | 1 |

    The checker shows two tables: the foreign key that `orders` has (target table, column, target column), then every order with the name of the customer, sorted by the order's `id`.
  check: |
    SELECT lower("table") AS target_table, lower("from") AS column_name, lower("to") AS target_column FROM pragma_foreign_key_list('orders');
    SELECT o.id, c.name, o.item, o.quantity FROM orders o JOIN customers c ON c.id = o.customer_id ORDER BY o.id;
  starter: |
    CREATE TABLE customers (
      id INTEGER PRIMARY KEY,
      name TEXT NOT NULL
    );

    INSERT INTO customers (id, name) VALUES
      (1, 'Sari'),
      (2, 'Budi'),
      (3, 'Dewi');

    -- 1. create the orders table

    -- 2. fill the orders table with five rows
  hints:
    - "A foreign key is written as a rule after the column type: `REFERENCES table(column)`. Then look at each customer's `id`: Sari 1, Budi 2, Dewi 3."
    - "The second column is `customer_id INTEGER REFERENCES customers(id)`. The first order row is `(1, 1, 'Milk Coffee', 2)`: order 1, belonging to customer 1."
    - "`INSERT INTO orders (id, customer_id, item, quantity) VALUES (1, 1, 'Milk Coffee', 2), (2, 2, 'Toast', 1), (3, 2, 'Black Coffee', 1), (4, 3, 'Pulled Tea', 3), (5, 1, 'Banana Fritters', 1);`"
  tests:
    - output: |
        target_table|column_name|target_column
        customers|customer_id|id

        id|name|item|quantity
        1|Sari|Milk Coffee|2
        2|Budi|Toast|1
        3|Budi|Black Coffee|1
        4|Dewi|Pulled Tea|3
        5|Sari|Banana Fritters|1
  solution: |
    CREATE TABLE customers (
      id INTEGER PRIMARY KEY,
      name TEXT NOT NULL
    );

    INSERT INTO customers (id, name) VALUES
      (1, 'Sari'),
      (2, 'Budi'),
      (3, 'Dewi');

    CREATE TABLE orders (
      id INTEGER PRIMARY KEY,
      customer_id INTEGER REFERENCES customers(id),
      item TEXT,
      quantity INTEGER
    );

    INSERT INTO orders (id, customer_id, item, quantity) VALUES
      (1, 1, 'Milk Coffee', 2),
      (2, 2, 'Toast', 1),
      (3, 2, 'Black Coffee', 1),
      (4, 3, 'Pulled Tea', 3),
      (5, 1, 'Banana Fritters', 1);

- slug: tidying-up-todays-records
  type: code
  title: Tidying up today's records
  prompt: |
    At the end of the day Ms. Rina finds three things to sort out in the `customers` and `orders` tables. Foreign key enforcement is switched on, so the order of your statements matters.

    1. The order with `id` 4 was recorded wrong: its `quantity` should be 2.
    2. Budi (the customer with `id` 2) cancelled everything. Delete **all** of Budi's orders, however many there are, then delete Budi from the `customers` table.
    3. There is a new customer: add `Rudi` to `customers` with `id` 4. Then add his order: 1 `Fried Rice`. Do not fill in the order's `id`, let the database hand out the number.

    The checker shows `id`, `name` from `customers`, then `id`, `customer_id`, `item`, `quantity` from `orders`, each sorted by `id`.
  setup: |
    PRAGMA foreign_keys = ON;
    CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT NOT NULL);
    CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER REFERENCES customers(id), item TEXT, quantity INTEGER);
    INSERT INTO customers VALUES (1, 'Sari'), (2, 'Budi'), (3, 'Dewi');
    INSERT INTO orders VALUES
      (1, 1, 'Milk Coffee', 2),
      (2, 2, 'Toast', 1),
      (3, 2, 'Black Coffee', 1),
      (4, 3, 'Pulled Tea', 3),
      (5, 1, 'Banana Fritters', 1);
  check: |
    SELECT id, name FROM customers ORDER BY id;
    SELECT id, customer_id, item, quantity FROM orders ORDER BY id;
  starter: |
    -- 1. fix the quantity of order 4
    UPDATE orders SET quantity = 2 WHERE id = 4;

    -- 2. delete all of Budi's orders, then delete Budi

    -- 3. add Rudi, then his order
  hints:
    - "Step 2: Budi's orders are the `orders` rows whose `customer_id` is 2. Delete those first, then Budi's row in `customers`. Step 3 is the reverse: the customer first, then the order."
    - "Step 2: `DELETE FROM orders WHERE customer_id = 2;` then `DELETE FROM customers WHERE id = 2;`. Step 3 starts with `INSERT INTO customers (id, name) VALUES (4, 'Rudi');`."
    - "The last statement does not mention `id`: `INSERT INTO orders (customer_id, item, quantity) VALUES (4, 'Fried Rice', 1);`."
  tests:
    - output: |
        id|name
        1|Sari
        3|Dewi
        4|Rudi

        id|customer_id|item|quantity
        1|1|Milk Coffee|2
        4|3|Pulled Tea|2
        5|1|Banana Fritters|1
        6|4|Fried Rice|1
    - input: |
        INSERT INTO orders VALUES
          (6, 2, 'Sweet Iced Tea', 2),
          (7, 3, 'Milk Coffee', 1);
      output: |
        id|name
        1|Sari
        3|Dewi
        4|Rudi

        id|customer_id|item|quantity
        1|1|Milk Coffee|2
        4|3|Pulled Tea|2
        5|1|Banana Fritters|1
        7|3|Milk Coffee|1
        8|4|Fried Rice|1
  solution: |
    UPDATE orders SET quantity = 2 WHERE id = 4;

    DELETE FROM orders WHERE customer_id = 2;
    DELETE FROM customers WHERE id = 2;

    INSERT INTO customers (id, name) VALUES (4, 'Rudi');
    INSERT INTO orders (customer_id, item, quantity) VALUES (4, 'Fried Rice', 1);

- slug: deleting-a-customer
  type: choice
  title: Deleting a customer
  prompt: |
    Foreign key enforcement is switched on. The `orders` table still has two rows with a `customer_id` of 1. What happens when this statement runs?

    ```sql
    DELETE FROM customers WHERE id = 1;
    ```
  options:
    - "Customer 1 is deleted, and the two orders are deleted along with it automatically"
    - "Customer 1 is deleted, and `customer_id` in the two orders becomes 0"
    - "The statement is rejected with `FOREIGN KEY constraint failed`, and nothing is deleted"
    - "Customer 1 is deleted, and the two orders stay as they are without any problem"
  correct: [2]
  hint: "A foreign key makes sure no order points at a customer who does not exist."
  explanation: "If customer 1 were deleted, those two orders would point at a customer who does not exist. The database rejects the statement and changes nothing. The right sequence: first delete the orders with `DELETE FROM orders WHERE customer_id = 1;`, then the customer."
