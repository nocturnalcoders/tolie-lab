- slug: items-no-longer-sold
  type: code
  title: Menu yang berhenti dijual
  prompt: |
    Bu Rina memutuskan tidak lagi menjual menu yang harganya di bawah Rp10000. Hapus dari tabel `menu` semua baris yang `harga`-nya kurang dari 10000.

    Pilih barisnya lewat harga, bukan lewat `id`, karena daftar menunya bisa berbeda. Pemeriksa akan menampilkan `id`, `nama`, `harga` dari tabel `menu` yang tersisa, urut menurut `id`.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
  check: |
    SELECT id, nama, harga FROM menu ORDER BY id;
  starter: |
    -- ini baru melihat barisnya. Ubah menjadi perintah yang menghapusnya.
    SELECT * FROM menu WHERE harga < 10000;
  hints:
    - "`SELECT` di editor sudah memilih baris yang tepat. `WHERE` yang sama bisa dipakai untuk menghapus."
    - "Bentuknya `DELETE FROM tabel WHERE syarat;`. Tidak ada `*` dan tidak ada daftar kolom setelah `DELETE`."
    - "Ganti `SELECT *` dengan `DELETE`: `DELETE FROM menu WHERE harga < 10000;`."
  tests:
    - output: |
        id|nama|harga
        1|Kopi Hitam|10000
        2|Kopi Susu|15000
        3|Teh Tarik|12000
        5|Roti Bakar|18000
        6|Pisang Goreng|12000
        7|Nasi Goreng|25000
    - input: |
        INSERT INTO menu VALUES
          (8, 'Air Mineral', 'minuman', 5000),
          (9, 'Jus Jeruk', 'minuman', 14000);
      output: |
        id|nama|harga
        1|Kopi Hitam|10000
        2|Kopi Susu|15000
        3|Teh Tarik|12000
        5|Roti Bakar|18000
        6|Pisang Goreng|12000
        7|Nasi Goreng|25000
        9|Jus Jeruk|14000
  solution: |
    DELETE FROM menu WHERE harga < 10000;

- slug: mistyped-orders
  type: code
  title: Pesanan salah ketik
  prompt: |
    Di tabel `pesanan` ada beberapa baris dengan `jumlah` 0. Itu salah ketik kasir dan harus dibuang. Hapus semua baris tabel `pesanan` yang `jumlah`-nya 0. Pesanan lain harus tetap ada.

    Pemeriksa akan menampilkan `id`, `tanggal`, `menu_id`, `jumlah` dari tabel `pesanan` yang tersisa, urut menurut `id`.
  setup: |
    CREATE TABLE pesanan (id INTEGER PRIMARY KEY, tanggal TEXT, menu_id INTEGER, jumlah INTEGER);
    INSERT INTO pesanan VALUES
      (1, '2024-03-04', 2, 2),
      (2, '2024-03-04', 5, 1),
      (3, '2024-03-04', 3, 0),
      (4, '2024-03-04', 2, 1),
      (5, '2024-03-05', 7, 2),
      (6, '2024-03-05', 1, 0),
      (7, '2024-03-05', 2, 3),
      (8, '2024-03-05', 6, 2);
  check: |
    SELECT id, tanggal, menu_id, jumlah FROM pesanan ORDER BY id;
  starter: |
    -- ini hanya menghapus satu baris. Hapus semua yang jumlahnya 0.
    DELETE FROM pesanan
    WHERE id = 3;
  hints:
    - "Baris yang salah bukan hanya `id` 3. Cari ciri yang sama pada semua baris yang salah."
    - "Syaratnya ada di kolom `jumlah`, bukan `id`. Satu `DELETE` bisa menghapus banyak baris kalau syaratnya cocok dengan banyak baris."
    - "Ganti syaratnya menjadi `WHERE jumlah = 0`."
  tests:
    - output: |
        id|tanggal|menu_id|jumlah
        1|2024-03-04|2|2
        2|2024-03-04|5|1
        4|2024-03-04|2|1
        5|2024-03-05|7|2
        7|2024-03-05|2|3
        8|2024-03-05|6|2
    - input: |
        INSERT INTO pesanan VALUES
          (9, '2024-03-06', 1, 0),
          (10, '2024-03-06', 5, 2);
      output: |
        id|tanggal|menu_id|jumlah
        1|2024-03-04|2|2
        2|2024-03-04|5|1
        4|2024-03-04|2|1
        5|2024-03-05|7|2
        7|2024-03-05|2|3
        8|2024-03-05|6|2
        10|2024-03-06|5|2
  solution: |
    DELETE FROM pesanan
    WHERE jumlah = 0;

- slug: delete-without-where
  type: choice
  title: DELETE tanpa WHERE
  prompt: |
    Tabel `menu` berisi 7 baris. Apa keadaannya setelah perintah ini dijalankan?

    ```sql
    DELETE FROM menu;
    ```
  options:
    - "Tabel `menu` hilang, dan `SELECT * FROM menu` gagal dengan `no such table`"
    - "Tabel `menu` masih ada dengan kolom yang sama, tetapi tanpa baris"
    - "Hanya baris terakhir yang terhapus"
    - "Tidak ada yang terhapus karena tidak ada `WHERE`"
  correct: [1]
  hint: "`DELETE` mengurus baris. Ada perintah lain yang mengurus tabel."
  explanation: "`DELETE` tanpa `WHERE` menghapus semua baris, tetapi tabel dan kolomnya tetap ada, jadi `SELECT * FROM menu` berjalan dan tidak mengembalikan baris. Yang membuang tabelnya sekaligus adalah `DROP TABLE menu`."
