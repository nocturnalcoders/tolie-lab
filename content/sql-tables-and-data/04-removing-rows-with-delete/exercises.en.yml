- slug: items-no-longer-sold
  type: code
  title: Items no longer sold
  prompt: |
    Ms. Rina has decided to stop selling items that cost less than Rp10000. Delete from the `menu` table every row whose `price` is below 10000.

    Pick the rows by price, not by `id`, because the menu can differ. The checker shows `id`, `name`, `price` of what is left in the `menu` table, sorted by `id`.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, name TEXT, category TEXT, price INTEGER);
    INSERT INTO menu VALUES
      (1, 'Black Coffee', 'drink', 10000),
      (2, 'Milk Coffee', 'drink', 15000),
      (3, 'Pulled Tea', 'drink', 12000),
      (4, 'Sweet Iced Tea', 'drink', 8000),
      (5, 'Toast', 'food', 18000),
      (6, 'Banana Fritters', 'food', 12000),
      (7, 'Fried Rice', 'food', 25000);
  check: |
    SELECT id, name, price FROM menu ORDER BY id;
  starter: |
    -- this only looks at the rows. Turn it into a statement that deletes them.
    SELECT * FROM menu WHERE price < 10000;
  hints:
    - "The `SELECT` in the editor already picks the right rows. The same `WHERE` can be used to delete."
    - "The shape is `DELETE FROM table WHERE condition;`. There is no `*` and no column list after `DELETE`."
    - "Replace `SELECT *` with `DELETE`: `DELETE FROM menu WHERE price < 10000;`."
  tests:
    - output: |
        id|name|price
        1|Black Coffee|10000
        2|Milk Coffee|15000
        3|Pulled Tea|12000
        5|Toast|18000
        6|Banana Fritters|12000
        7|Fried Rice|25000
    - input: |
        INSERT INTO menu VALUES
          (8, 'Mineral Water', 'drink', 5000),
          (9, 'Orange Juice', 'drink', 14000);
      output: |
        id|name|price
        1|Black Coffee|10000
        2|Milk Coffee|15000
        3|Pulled Tea|12000
        5|Toast|18000
        6|Banana Fritters|12000
        7|Fried Rice|25000
        9|Orange Juice|14000
  solution: |
    DELETE FROM menu WHERE price < 10000;

- slug: mistyped-orders
  type: code
  title: Mistyped orders
  prompt: |
    The `orders` table holds a few rows with a `quantity` of 0. Those are the cashier's typing mistakes and have to go. Delete every row of the `orders` table whose `quantity` is 0. The other orders must stay.

    The checker shows `id`, `order_date`, `menu_id`, `quantity` of what is left in the `orders` table, sorted by `id`.
  setup: |
    CREATE TABLE orders (id INTEGER PRIMARY KEY, order_date TEXT, menu_id INTEGER, quantity INTEGER);
    INSERT INTO orders VALUES
      (1, '2024-03-04', 2, 2),
      (2, '2024-03-04', 5, 1),
      (3, '2024-03-04', 3, 0),
      (4, '2024-03-04', 2, 1),
      (5, '2024-03-05', 7, 2),
      (6, '2024-03-05', 1, 0),
      (7, '2024-03-05', 2, 3),
      (8, '2024-03-05', 6, 2);
  check: |
    SELECT id, order_date, menu_id, quantity FROM orders ORDER BY id;
  starter: |
    -- this deletes just one row. Delete every row with a quantity of 0.
    DELETE FROM orders
    WHERE id = 3;
  hints:
    - "The wrong rows are not only `id` 3. Look for what all the wrong rows have in common."
    - "The condition is on the `quantity` column, not `id`. One `DELETE` can remove many rows when its condition matches many rows."
    - "Change the condition to `WHERE quantity = 0`."
  tests:
    - output: |
        id|order_date|menu_id|quantity
        1|2024-03-04|2|2
        2|2024-03-04|5|1
        4|2024-03-04|2|1
        5|2024-03-05|7|2
        7|2024-03-05|2|3
        8|2024-03-05|6|2
    - input: |
        INSERT INTO orders VALUES
          (9, '2024-03-06', 1, 0),
          (10, '2024-03-06', 5, 2);
      output: |
        id|order_date|menu_id|quantity
        1|2024-03-04|2|2
        2|2024-03-04|5|1
        4|2024-03-04|2|1
        5|2024-03-05|7|2
        7|2024-03-05|2|3
        8|2024-03-05|6|2
        10|2024-03-06|5|2
  solution: |
    DELETE FROM orders
    WHERE quantity = 0;

- slug: delete-without-where
  type: choice
  title: DELETE without WHERE
  prompt: |
    The `menu` table holds 7 rows. What is the situation after this statement runs?

    ```sql
    DELETE FROM menu;
    ```
  options:
    - "The `menu` table is gone, and `SELECT * FROM menu` fails with `no such table`"
    - "The `menu` table is still there with the same columns, but without rows"
    - "Only the last row is deleted"
    - "Nothing is deleted because there is no `WHERE`"
  correct: [1]
  hint: "`DELETE` deals with rows. A different statement deals with tables."
  explanation: "`DELETE` without `WHERE` removes every row, but the table and its columns remain, so `SELECT * FROM menu` runs and returns no rows. The statement that throws away the table itself is `DROP TABLE menu`."
