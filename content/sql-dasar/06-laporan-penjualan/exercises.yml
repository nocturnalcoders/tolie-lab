- slug: rincian-pesanan
  type: code
  title: Rincian pesanan
  prompt: |
    Buat rincian setiap pesanan dengan menggabungkan tabel `pesanan` dan `menu`. Tampilkan empat kolom: `id` pesanan, `nama` menu, `jumlah`, dan `subtotal` (harga menu dikali jumlah). Urutkan menurut `id` pesanan.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
    CREATE TABLE pesanan (id INTEGER PRIMARY KEY, tanggal TEXT, menu_id INTEGER, jumlah INTEGER);
    INSERT INTO pesanan VALUES
      (1, '2024-03-04', 2, 2),
      (2, '2024-03-04', 5, 1),
      (3, '2024-03-04', 3, 3),
      (4, '2024-03-04', 2, 1),
      (5, '2024-03-05', 7, 2),
      (6, '2024-03-05', 1, 4),
      (7, '2024-03-05', 2, 3),
      (8, '2024-03-05', 6, 2);
  starter: |
    -- gabungkan dengan tabel menu, lalu tambahkan nama dan subtotal
    SELECT p.id, p.jumlah
    FROM pesanan p
    ORDER BY p.id;
  hints:
    - "Nama dan harga ada di tabel `menu`. Pasangan tiap pesanan adalah baris menu yang `id`-nya sama dengan `menu_id` pesanan itu."
    - "Tambahkan `JOIN menu m ON m.id = p.menu_id` setelah `FROM pesanan p`. Setelah itu `m.nama` dan `m.harga` bisa dipakai di `SELECT`."
    - "Kolomnya: `SELECT p.id, m.nama, p.jumlah, m.harga * p.jumlah AS subtotal`."
  tests:
    - output: |
        id|nama|jumlah|subtotal
        1|Kopi Susu|2|30000
        2|Roti Bakar|1|18000
        3|Teh Tarik|3|36000
        4|Kopi Susu|1|15000
        5|Nasi Goreng|2|50000
        6|Kopi Hitam|4|40000
        7|Kopi Susu|3|45000
        8|Pisang Goreng|2|24000
    - input: |
        INSERT INTO menu VALUES (8, 'Jus Jeruk', 'minuman', 14000);
        INSERT INTO pesanan VALUES
          (9, '2024-03-06', 4, 5),
          (10, '2024-03-06', 8, 2);
      output: |
        id|nama|jumlah|subtotal
        1|Kopi Susu|2|30000
        2|Roti Bakar|1|18000
        3|Teh Tarik|3|36000
        4|Kopi Susu|1|15000
        5|Nasi Goreng|2|50000
        6|Kopi Hitam|4|40000
        7|Kopi Susu|3|45000
        8|Pisang Goreng|2|24000
        9|Es Teh Manis|5|40000
        10|Jus Jeruk|2|28000
  solution: |
    SELECT p.id, m.nama, p.jumlah, m.harga * p.jumlah AS subtotal
    FROM pesanan p
    JOIN menu m ON m.id = p.menu_id
    ORDER BY p.id;

- slug: laporan-penjualan
  type: code
  title: Laporan penjualan
  prompt: |
    Saatnya membuat laporan untuk Bu Rina. Gabungkan `pesanan` dengan `menu`, lalu tampilkan satu baris per menu yang pernah dipesan, dengan tiga kolom:

    - `nama`: nama menu
    - `terjual`: jumlah semua porsi yang dipesan
    - `omzet`: jumlah dari harga dikali jumlah

    Urutkan dari `omzet` terbesar. Bila sama, urutkan menurut `nama` sesuai abjad.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
    CREATE TABLE pesanan (id INTEGER PRIMARY KEY, tanggal TEXT, menu_id INTEGER, jumlah INTEGER);
    INSERT INTO pesanan VALUES
      (1, '2024-03-04', 2, 2),
      (2, '2024-03-04', 5, 1),
      (3, '2024-03-04', 3, 3),
      (4, '2024-03-04', 2, 1),
      (5, '2024-03-05', 7, 2),
      (6, '2024-03-05', 1, 4),
      (7, '2024-03-05', 2, 3),
      (8, '2024-03-05', 6, 2);
  starter: |
    -- kelompokkan per menu, hitung terjual dan omzet, lalu urutkan
    SELECT m.nama
    FROM pesanan p
    JOIN menu m ON m.id = p.menu_id;
  hints:
    - "Kerjakan bertahap: gabungannya sudah ada. Berikutnya kelompokkan per nama menu, lalu hitung dua agregat untuk tiap kelompok."
    - "Pakai `GROUP BY m.nama`. Porsi terjual adalah `SUM(p.jumlah)`, dan omzet adalah `SUM(m.harga * p.jumlah)`."
    - "Kolomnya `m.nama, SUM(p.jumlah) AS terjual, SUM(m.harga * p.jumlah) AS omzet`, lalu setelah `JOIN`: `GROUP BY m.nama` dan `ORDER BY omzet DESC, m.nama`."
  tests:
    - output: |
        nama|terjual|omzet
        Kopi Susu|6|90000
        Nasi Goreng|2|50000
        Kopi Hitam|4|40000
        Teh Tarik|3|36000
        Pisang Goreng|2|24000
        Roti Bakar|1|18000
    - input: |
        INSERT INTO menu VALUES (8, 'Jus Jeruk', 'minuman', 14000);
        INSERT INTO pesanan VALUES
          (9, '2024-03-06', 8, 3),
          (10, '2024-03-06', 5, 2),
          (11, '2024-03-06', 4, 3);
      output: |
        nama|terjual|omzet
        Kopi Susu|6|90000
        Roti Bakar|3|54000
        Nasi Goreng|2|50000
        Jus Jeruk|3|42000
        Kopi Hitam|4|40000
        Teh Tarik|3|36000
        Es Teh Manis|3|24000
        Pisang Goreng|2|24000
  solution: |
    SELECT m.nama, SUM(p.jumlah) AS terjual, SUM(m.harga * p.jumlah) AS omzet
    FROM pesanan p
    JOIN menu m ON m.id = p.menu_id
    GROUP BY m.nama
    ORDER BY omzet DESC, m.nama;

- slug: kuis-join
  type: choice
  title: Menu yang belum dipesan
  prompt: |
    Es Teh Manis ada di tabel `menu`, tetapi belum ada satu pun baris `pesanan` untuknya. Apa yang terjadi pada Es Teh Manis di hasil perintah ini?

    ```sql
    SELECT m.nama, p.jumlah
    FROM pesanan p
    JOIN menu m ON m.id = p.menu_id;
    ```
  options:
    - "Tampil satu kali dengan `jumlah` 0"
    - "Tampil satu kali dengan `jumlah` NULL"
    - "Tidak tampil sama sekali"
    - "Perintahnya gagal dengan pesan kesalahan"
  correct: [2]
  hint: "`JOIN` membentuk baris hasil dari pasangan yang cocok menurut `ON`."
  explanation: "`JOIN` hanya menghasilkan baris bila ada pasangan yang memenuhi syarat `ON`. Tidak ada pesanan dengan `menu_id` milik Es Teh Manis, jadi tidak ada pasangan dan menu itu tidak muncul."
