- slug: termurah-dulu
  type: code
  title: Dari yang termurah
  prompt: |
    Bu Rina ingin papan menu baru yang diurutkan dari harga termurah. Tampilkan `nama` dan `harga` semua baris tabel `menu`, urut menurut `harga` dari yang terkecil. Bila harganya sama, urutkan menurut `nama` sesuai abjad.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
  starter: |
    -- urutkan menurut harga, lalu nama
    SELECT nama, harga FROM menu;
  hints:
    - "Pengurutan ditulis di akhir perintah dengan `ORDER BY`."
    - "`ORDER BY harga` saja belum cukup: dua menu berharga 12000 perlu penentu kedua. Kolom pengurut boleh lebih dari satu, dipisah koma."
    - "Akhiri perintahnya dengan `ORDER BY harga, nama`."
  tests:
    - output: |
        nama|harga
        Es Teh Manis|8000
        Kopi Hitam|10000
        Pisang Goreng|12000
        Teh Tarik|12000
        Kopi Susu|15000
        Roti Bakar|18000
        Nasi Goreng|25000
    - input: |
        INSERT INTO menu VALUES
          (8, 'Bakwan', 'makanan', 12000),
          (9, 'Air Mineral', 'minuman', 5000);
      output: |
        nama|harga
        Air Mineral|5000
        Es Teh Manis|8000
        Kopi Hitam|10000
        Bakwan|12000
        Pisang Goreng|12000
        Teh Tarik|12000
        Kopi Susu|15000
        Roti Bakar|18000
        Nasi Goreng|25000
  solution: |
    SELECT nama, harga FROM menu ORDER BY harga, nama;

- slug: tiga-termahal
  type: code
  title: Tiga menu termahal
  prompt: |
    Tampilkan `nama` dan `harga` **tiga** menu termahal dari tabel `menu`, mulai dari yang paling mahal. Bila harganya sama, dahulukan `nama` yang lebih awal menurut abjad.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
  starter: |
    -- urutkan dari yang termahal, lalu ambil tiga baris saja
    SELECT nama, harga FROM menu
    ORDER BY harga;
  hints:
    - "Ada dua langkah: urutkan dari harga terbesar, lalu ambil tiga baris pertama."
    - "`DESC` membalik urutan sebuah kolom, dan `LIMIT 3` mengambil tiga baris pertama. Jangan lupa `nama` sebagai penentu bila harganya sama."
    - "Akhiri perintahnya dengan `ORDER BY harga DESC, nama LIMIT 3`."
  tests:
    - output: |
        nama|harga
        Nasi Goreng|25000
        Roti Bakar|18000
        Kopi Susu|15000
    - input: |
        INSERT INTO menu VALUES
          (8, 'Mie Goreng', 'makanan', 22000),
          (9, 'Es Kopi Gula Aren', 'minuman', 18000);
      output: |
        nama|harga
        Nasi Goreng|25000
        Mie Goreng|22000
        Es Kopi Gula Aren|18000
  solution: |
    SELECT nama, harga FROM menu
    ORDER BY harga DESC, nama
    LIMIT 3;

- slug: kuis-termurah
  type: choice
  title: Satu yang termurah
  prompt: |
    Perintah mana yang menampilkan **satu** menu dengan harga termurah?
  options:
    - "`SELECT nama FROM menu ORDER BY harga DESC LIMIT 1;`"
    - "`SELECT nama FROM menu LIMIT 1 ORDER BY harga;`"
    - "`SELECT nama FROM menu ORDER BY harga LIMIT 1;`"
    - "`SELECT nama FROM menu LIMIT 1;`"
  correct: [2]
  hint: "Urutan bawaan `ORDER BY` adalah dari kecil ke besar, dan `LIMIT` ditulis paling akhir."
  explanation: "`ORDER BY harga` mengurutkan dari yang termurah, lalu `LIMIT 1` mengambil baris pertamanya. Dengan `DESC` yang terambil justru yang termahal, `LIMIT` sebelum `ORDER BY` adalah salah tulis, dan `LIMIT 1` tanpa pengurutan mengambil baris yang tidak tentu."
