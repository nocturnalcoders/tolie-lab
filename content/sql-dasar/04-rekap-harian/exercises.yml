- slug: rekap-satu-maret
  type: code
  title: Rekap 1 Maret
  prompt: |
    Buat rekap untuk tanggal `2024-03-01` dari tabel `penjualan`. Hasilnya satu baris dengan dua kolom: `transaksi` (banyaknya baris penjualan pada tanggal itu) dan `omzet` (jumlah semua `subtotal` pada tanggal itu).
  setup: |
    CREATE TABLE penjualan (id INTEGER PRIMARY KEY, tanggal TEXT, item TEXT, jumlah INTEGER, subtotal INTEGER);
    INSERT INTO penjualan VALUES
      (1, '2024-03-01', 'Kopi Susu', 3, 45000),
      (2, '2024-03-01', 'Roti Bakar', 1, 18000),
      (3, '2024-03-01', 'Teh Tarik', 2, 24000),
      (4, '2024-03-01', 'Kopi Susu', 2, 30000),
      (5, '2024-03-02', 'Kopi Hitam', 4, 40000),
      (6, '2024-03-02', 'Nasi Goreng', 2, 50000),
      (7, '2024-03-02', 'Kopi Susu', 1, 15000),
      (8, '2024-03-02', 'Pisang Goreng', 3, 36000),
      (9, '2024-03-03', 'Teh Tarik', 1, 12000),
      (10, '2024-03-03', 'Kopi Susu', 4, 60000),
      (11, '2024-03-03', 'Roti Bakar', 2, 36000);
  starter: |
    -- tambahkan kolom omzet, dan hitung hanya tanggal 2024-03-01
    SELECT COUNT(*) AS transaksi FROM penjualan;
  hints:
    - "Dua hal masih kurang: penyaring tanggal, dan kolom kedua yang menjumlahkan `subtotal`."
    - "Saring dengan `WHERE tanggal = '2024-03-01'`. Banyaknya baris dihitung `COUNT(*)`, jumlah rupiahnya `SUM(subtotal)`."
    - "Jawabannya: `SELECT COUNT(*) AS transaksi, SUM(subtotal) AS omzet FROM penjualan WHERE tanggal = '2024-03-01';`."
  tests:
    - output: |
        transaksi|omzet
        4|117000
    - input: |
        INSERT INTO penjualan VALUES
          (12, '2024-03-01', 'Kopi Hitam', 2, 20000),
          (13, '2024-03-04', 'Kopi Susu', 1, 15000);
      output: |
        transaksi|omzet
        5|137000
  solution: |
    SELECT COUNT(*) AS transaksi, SUM(subtotal) AS omzet
    FROM penjualan
    WHERE tanggal = '2024-03-01';

- slug: statistik-transaksi
  type: code
  title: Statistik transaksi
  prompt: |
    Bu Rina ingin gambaran besar-kecilnya transaksi. Dari **semua** baris tabel `penjualan`, tampilkan satu baris dengan tiga kolom: `terkecil` (subtotal terkecil), `terbesar` (subtotal terbesar), dan `rata_rata` (rata-rata subtotal, dibulatkan dengan `ROUND`).
  setup: |
    CREATE TABLE penjualan (id INTEGER PRIMARY KEY, tanggal TEXT, item TEXT, jumlah INTEGER, subtotal INTEGER);
    INSERT INTO penjualan VALUES
      (1, '2024-03-01', 'Kopi Susu', 3, 45000),
      (2, '2024-03-01', 'Roti Bakar', 1, 18000),
      (3, '2024-03-01', 'Teh Tarik', 2, 24000),
      (4, '2024-03-01', 'Kopi Susu', 2, 30000),
      (5, '2024-03-02', 'Kopi Hitam', 4, 40000),
      (6, '2024-03-02', 'Nasi Goreng', 2, 50000),
      (7, '2024-03-02', 'Kopi Susu', 1, 15000),
      (8, '2024-03-02', 'Pisang Goreng', 3, 36000),
      (9, '2024-03-03', 'Teh Tarik', 1, 12000),
      (10, '2024-03-03', 'Kopi Susu', 4, 60000),
      (11, '2024-03-03', 'Roti Bakar', 2, 36000);
  starter: |
    -- lengkapi dengan terbesar dan rata_rata
    SELECT MIN(subtotal) AS terkecil FROM penjualan;
  hints:
    - "Satu `SELECT` boleh berisi beberapa fungsi agregat, dipisah koma, masing-masing dengan `AS`."
    - "Terbesar dicari dengan `MAX(subtotal)`, rata-rata dengan `AVG(subtotal)`. Rata-ratanya perlu dibungkus `ROUND(...)`."
    - "Tiga kolomnya: `MIN(subtotal) AS terkecil, MAX(subtotal) AS terbesar, ROUND(AVG(subtotal)) AS rata_rata`."
  tests:
    - output: |
        terkecil|terbesar|rata_rata
        12000|60000|33273
    - input: |
        INSERT INTO penjualan VALUES
          (12, '2024-03-04', 'Es Teh Manis', 1, 8000),
          (13, '2024-03-04', 'Nasi Goreng', 3, 75000);
      output: |
        terkecil|terbesar|rata_rata
        8000|75000|34538
  solution: |
    SELECT MIN(subtotal) AS terkecil,
           MAX(subtotal) AS terbesar,
           ROUND(AVG(subtotal)) AS rata_rata
    FROM penjualan;

- slug: kuis-sum-count
  type: choice
  title: SUM atau COUNT?
  prompt: |
    Apa yang dihitung perintah ini?

    ```sql
    SELECT SUM(jumlah) FROM penjualan WHERE item = 'Kopi Susu';
    ```
  options:
    - "Banyaknya transaksi yang berisi Kopi Susu"
    - "Banyaknya porsi Kopi Susu yang terjual"
    - "Uang yang masuk dari Kopi Susu"
    - "Harga satu porsi Kopi Susu"
  correct: [1]
  hint: "`SUM` menjumlahkan isi kolom, `COUNT` menghitung baris. Kolom `jumlah` berisi banyaknya porsi."
  explanation: "`SUM(jumlah)` menjumlahkan porsi dari setiap transaksi Kopi Susu: 3 + 2 + 1 + 4 = 10 porsi. Banyaknya transaksi (4) dihitung dengan `COUNT(*)`, dan uang yang masuk dengan `SUM(subtotal)`."
