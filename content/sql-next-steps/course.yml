translations:
  en:
    title: "SQL Next Steps: Reports for a Coffee Shop"
    level: Intermediate
    summary: >-
      The follow-up to SQL Basics, still with the data of Senja Coffee Shop:
      finding menu items nobody has ordered with LEFT JOIN, grouping with CASE,
      using subqueries, building reports per day and per month, writing
      multi-step reports with WITH, and ranking the best sellers with a window
      function.
    perks:
      - 6 lessons, 12 coding exercises and 6 multiple-choice questions
      - Every exercise runs right in your browser, nothing to install
      - A completion certificate from tolie.space, signed by Christianto Lie
