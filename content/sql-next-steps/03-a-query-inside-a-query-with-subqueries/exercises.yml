- slug: above-the-average
  type: code
  title: Di atas rata-rata
  prompt: |
    Tampilkan `nama` dan `harga` setiap menu yang harganya **lebih besar** dari rata-rata harga semua menu. Rata-ratanya harus dihitung dari tabel, karena daftar menu bisa berubah. Urutkan dari `harga` termahal. Bila sama, urutkan menurut `nama` sesuai abjad.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
  starter: |
    -- angka 14286 ditulis tangan; ganti dengan subquery yang menghitung rata-rata
    SELECT nama, harga
    FROM menu
    WHERE harga > 14286
    ORDER BY harga DESC, nama;
  hints:
    - "Angka yang ditulis tangan hanya benar selama daftar menunya tidak berubah. Biarkan database yang menghitung rata-ratanya."
    - "Rata-rata harga dihitung dengan `SELECT AVG(harga) FROM menu`. Taruh perintah itu di dalam tanda kurung, di tempat angka 14286."
    - "Syaratnya: `WHERE harga > (SELECT AVG(harga) FROM menu)`."
  tests:
    - output: |
        nama|harga
        Nasi Goreng|25000
        Roti Bakar|18000
        Kopi Susu|15000
    - input: |
        INSERT INTO menu VALUES (8, 'Paket Sarapan', 'makanan', 60000);
      output: |
        nama|harga
        Paket Sarapan|60000
        Nasi Goreng|25000
    - input: |
        INSERT INTO menu VALUES
          (8, 'Air Mineral', 'minuman', 5000),
          (9, 'Kerupuk', 'makanan', 2000);
      output: |
        nama|harga
        Nasi Goreng|25000
        Roti Bakar|18000
        Kopi Susu|15000
        Pisang Goreng|12000
        Teh Tarik|12000
  solution: |
    SELECT nama, harga
    FROM menu
    WHERE harga > (SELECT AVG(harga) FROM menu)
    ORDER BY harga DESC, nama;

- slug: items-ordered-that-day
  type: code
  title: Menu yang dipesan hari itu
  prompt: |
    Bu Rina ingin tahu menu apa saja yang dipesan pada tanggal `2024-03-04`. Tampilkan `nama` dan `harga` setiap menu yang punya pesanan pada tanggal itu. Setiap menu tampil **satu kali saja**, berapa kali pun ia dipesan. Urutkan menurut `id` menu.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
    CREATE TABLE pesanan (id INTEGER PRIMARY KEY, tanggal TEXT, menu_id INTEGER, jumlah INTEGER);
    INSERT INTO pesanan VALUES
      (1, '2024-03-04', 2, 2),
      (2, '2024-03-04', 5, 1),
      (3, '2024-03-04', 3, 3),
      (4, '2024-03-04', 2, 1),
      (5, '2024-03-05', 7, 2),
      (6, '2024-03-05', 1, 4),
      (7, '2024-03-05', 2, 3),
      (8, '2024-03-05', 6, 2);
  starter: |
    -- JOIN ini menampilkan Kopi Susu dua kali; ganti dengan IN dan subquery
    SELECT m.nama, m.harga
    FROM menu m
    JOIN pesanan p ON p.menu_id = m.id
    WHERE p.tanggal = '2024-03-04'
    ORDER BY m.id;
  hints:
    - "`JOIN` membuat satu baris per pesanan, jadi menu yang dipesan dua kali tampil dua kali. Yang kamu butuhkan: ambil dari `menu` saja, lalu saring menurut daftar `menu_id` yang dipesan hari itu."
    - "Daftarnya: `SELECT menu_id FROM pesanan WHERE tanggal = '2024-03-04'`. Taruh di dalam kurung setelah `IN`."
    - "Seluruhnya: `SELECT nama, harga FROM menu WHERE id IN (SELECT menu_id FROM pesanan WHERE tanggal = '2024-03-04') ORDER BY id;`"
  tests:
    - output: |
        nama|harga
        Kopi Susu|15000
        Teh Tarik|12000
        Roti Bakar|18000
    - input: |
        INSERT INTO pesanan VALUES
          (9, '2024-03-04', 7, 1),
          (10, '2024-03-04', 2, 2),
          (11, '2024-03-06', 4, 3);
      output: |
        nama|harga
        Kopi Susu|15000
        Teh Tarik|12000
        Roti Bakar|18000
        Nasi Goreng|25000
  solution: |
    SELECT nama, harga
    FROM menu
    WHERE id IN (SELECT menu_id FROM pesanan WHERE tanggal = '2024-03-04')
    ORDER BY id;

- slug: the-most-expensive-item
  type: choice
  title: Menu termahal
  prompt: |
    Bu Rina ingin melihat `nama` menu yang harganya paling mahal. Perintah mana yang berjalan dan memberi jawaban yang benar, juga setelah daftar menu berubah?
  options:
    - "`SELECT nama FROM menu WHERE harga = MAX(harga);`"
    - "`SELECT nama FROM menu WHERE harga = (SELECT MAX(harga) FROM menu);`"
    - "`SELECT nama FROM menu WHERE harga = 25000;`"
    - "`SELECT nama FROM menu WHERE harga IN (SELECT harga FROM menu);`"
  correct: [1]
  hint: "`WHERE` tidak boleh berisi fungsi agregat secara langsung, dan angka yang ditulis tangan tidak ikut berubah."
  explanation: "Subquery `(SELECT MAX(harga) FROM menu)` menghasilkan satu nilai, yaitu harga termahal saat itu, lalu `WHERE` membandingkan tiap menu dengan nilai tersebut. Pilihan pertama gagal karena agregat tidak boleh langsung di `WHERE`. Angka 25000 hanya benar untuk daftar menu hari ini. Pilihan terakhir menampilkan semua menu, karena setiap harga pasti ada di daftar harga."
