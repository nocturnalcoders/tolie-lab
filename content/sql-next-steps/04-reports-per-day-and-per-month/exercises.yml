- slug: revenue-per-month
  type: code
  title: Omzet per bulan
  prompt: |
    Buat laporan bulanan untuk Bu Rina. Gabungkan `pesanan` dengan `menu`, lalu tampilkan satu baris per bulan dengan tiga kolom:

    - `bulan`: teks tahun dan bulan, misalnya `2024-03`
    - `transaksi`: banyaknya pesanan pada bulan itu
    - `omzet`: jumlah dari harga dikali jumlah

    Urutkan menurut `bulan`.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
    CREATE TABLE pesanan (id INTEGER PRIMARY KEY, tanggal TEXT, menu_id INTEGER, jumlah INTEGER);
    INSERT INTO pesanan VALUES
      (1, '2024-02-26', 2, 2),
      (2, '2024-02-26', 5, 1),
      (3, '2024-02-28', 3, 3),
      (4, '2024-03-01', 2, 1),
      (5, '2024-03-01', 7, 2),
      (6, '2024-03-15', 1, 4),
      (7, '2024-03-27', 2, 3),
      (8, '2024-03-29', 6, 3),
      (9, '2024-03-31', 5, 2),
      (10, '2024-04-01', 2, 2),
      (11, '2024-04-01', 1, 3),
      (12, '2024-04-02', 7, 1);
  starter: |
    -- ini masih rekap per hari; ubah menjadi per bulan
    SELECT p.tanggal AS bulan, COUNT(*) AS transaksi, SUM(m.harga * p.jumlah) AS omzet
    FROM pesanan p
    JOIN menu m ON m.id = p.menu_id
    GROUP BY p.tanggal
    ORDER BY p.tanggal;
  hints:
    - "Supaya semua tanggal di bulan yang sama masuk ke satu kelompok, ubah dulu tiap tanggal menjadi teks bulannya."
    - "`strftime('%Y-%m', p.tanggal)` mengubah `2024-03-15` menjadi `2024-03`. Pakai itu sebagai kolom `bulan`."
    - "Baris pertama menjadi `SELECT strftime('%Y-%m', p.tanggal) AS bulan, ...`, lalu `GROUP BY bulan` dan `ORDER BY bulan`."
  tests:
    - output: |
        bulan|transaksi|omzet
        2024-02|3|84000
        2024-03|6|222000
        2024-04|3|85000
    - input: |
        INSERT INTO pesanan VALUES
          (13, '2024-02-29', 4, 2),
          (14, '2024-05-01', 2, 1),
          (15, '2024-05-03', 5, 2);
      output: |
        bulan|transaksi|omzet
        2024-02|4|100000
        2024-03|6|222000
        2024-04|3|85000
        2024-05|2|51000
  solution: |
    SELECT strftime('%Y-%m', p.tanggal) AS bulan, COUNT(*) AS transaksi, SUM(m.harga * p.jumlah) AS omzet
    FROM pesanan p
    JOIN menu m ON m.id = p.menu_id
    GROUP BY bulan
    ORDER BY bulan;

- slug: the-last-seven-days
  type: code
  title: Tujuh hari terakhir
  prompt: |
    Bu Rina ingin melihat porsi terjual per hari selama **tujuh hari terakhir**, dihitung dari tanggal pesanan paling baru di tabel (tanggal itu ikut dihitung). Contoh: bila tanggal terbaru `2024-04-02`, yang masuk adalah `2024-03-27` sampai `2024-04-02`.

    Dari tabel `pesanan`, tampilkan `tanggal` dan jumlah semua `jumlah` pada hari itu dengan nama kolom `porsi`. Hari tanpa pesanan tidak perlu tampil. Urutkan menurut `tanggal`.
  setup: |
    CREATE TABLE pesanan (id INTEGER PRIMARY KEY, tanggal TEXT, menu_id INTEGER, jumlah INTEGER);
    INSERT INTO pesanan VALUES
      (1, '2024-02-26', 2, 2),
      (2, '2024-02-26', 5, 1),
      (3, '2024-02-28', 3, 3),
      (4, '2024-03-01', 2, 1),
      (5, '2024-03-01', 7, 2),
      (6, '2024-03-15', 1, 4),
      (7, '2024-03-27', 2, 3),
      (8, '2024-03-29', 6, 3),
      (9, '2024-03-31', 5, 2),
      (10, '2024-04-01', 2, 2),
      (11, '2024-04-01', 1, 3),
      (12, '2024-04-02', 7, 1);
  starter: |
    -- batas tanggalnya ditulis tangan; hitung dari tanggal terbaru di tabel
    SELECT tanggal, SUM(jumlah) AS porsi
    FROM pesanan
    WHERE tanggal > '2024-03-26'
    GROUP BY tanggal
    ORDER BY tanggal;
  hints:
    - "Batas `2024-03-26` adalah tujuh hari sebelum `2024-04-02`. Kalau ada pesanan yang lebih baru, batasnya harus ikut bergeser, jadi keduanya perlu dihitung oleh database."
    - "Tanggal terbaru didapat dengan subquery `(SELECT MAX(tanggal) FROM pesanan)`. Fungsi `date(tanggal, '-7 days')` memundurkannya tujuh hari."
    - "Syaratnya: `WHERE tanggal > date((SELECT MAX(tanggal) FROM pesanan), '-7 days')`."
  tests:
    - output: |
        tanggal|porsi
        2024-03-27|3
        2024-03-29|3
        2024-03-31|2
        2024-04-01|5
        2024-04-02|1
    - input: |
        INSERT INTO pesanan VALUES
          (13, '2024-04-04', 3, 2),
          (14, '2024-04-04', 4, 1);
      output: |
        tanggal|porsi
        2024-03-29|3
        2024-03-31|2
        2024-04-01|5
        2024-04-02|1
        2024-04-04|3
    - input: |
        INSERT INTO pesanan VALUES (13, '2024-04-03', 1, 1);
      output: |
        tanggal|porsi
        2024-03-29|3
        2024-03-31|2
        2024-04-01|5
        2024-04-02|1
        2024-04-03|1
  solution: |
    SELECT tanggal, SUM(jumlah) AS porsi
    FROM pesanan
    WHERE tanggal > date((SELECT MAX(tanggal) FROM pesanan), '-7 days')
    GROUP BY tanggal
    ORDER BY tanggal;

- slug: date-formats
  type: choice
  title: Format tanggal
  prompt: |
    Sebuah warung lain menyimpan tanggal sebagai teks `hari-bulan-tahun`, misalnya `'15-03-2024'`. Apa akibatnya untuk `ORDER BY tanggal`?
  options:
    - "Tidak ada masalah, database mengenali tanggal dalam format apa pun"
    - "Baris terurut menurut angka hari lebih dulu, jadi `'01-04-2024'` tampil sebelum `'15-03-2024'`"
    - "Perintahnya gagal karena teks tidak bisa diurutkan"
    - "Baris terurut menurut tahun, lalu bulan, lalu hari"
  correct: [1]
  hint: "Tanggal disimpan sebagai teks, dan teks dibandingkan huruf demi huruf dari kiri."
  explanation: "Teks dibandingkan dari kiri, jadi yang pertama menentukan adalah angka hari: `'01-04-2024'` lebih kecil dari `'15-03-2024'` walaupun 1 April terjadi setelah 15 Maret. Format `tahun-bulan-hari` tidak punya masalah ini, karena bagian yang paling menentukan ditulis paling kiri. Format itu juga yang dipahami `strftime` dan `date`."
