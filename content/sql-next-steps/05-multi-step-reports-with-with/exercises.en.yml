- slug: the-busy-days
  type: code
  title: The busy days
  prompt: |
    Ms. Rina wants to know which days had revenue **above the average daily revenue**. Do it in two steps: a CTE `daily` holds the revenue of every date, then the main statement picks the days whose revenue is higher than the average `revenue` in `daily`.

    Show `order_date` and `revenue`. Sort by `order_date`.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, name TEXT, category TEXT, price INTEGER);
    INSERT INTO menu VALUES
      (1, 'Black Coffee', 'drink', 10000),
      (2, 'Milk Coffee', 'drink', 15000),
      (3, 'Pulled Tea', 'drink', 12000),
      (4, 'Sweet Iced Tea', 'drink', 8000),
      (5, 'Toast', 'food', 18000),
      (6, 'Banana Fritters', 'food', 12000),
      (7, 'Fried Rice', 'food', 25000);
    CREATE TABLE orders (id INTEGER PRIMARY KEY, order_date TEXT, menu_id INTEGER, quantity INTEGER);
    INSERT INTO orders VALUES
      (1, '2024-02-26', 2, 2),
      (2, '2024-02-26', 5, 1),
      (3, '2024-02-28', 3, 3),
      (4, '2024-03-01', 2, 1),
      (5, '2024-03-01', 7, 2),
      (6, '2024-03-15', 1, 4),
      (7, '2024-03-27', 2, 3),
      (8, '2024-03-29', 6, 3),
      (9, '2024-03-31', 5, 2),
      (10, '2024-04-01', 2, 2),
      (11, '2024-04-01', 1, 3),
      (12, '2024-04-02', 7, 1);
  starter: |
    -- the daily CTE is done; keep the days whose revenue is above the average
    WITH daily AS (
      SELECT o.order_date, SUM(m.price * o.quantity) AS revenue
      FROM orders o
      JOIN menu m ON m.id = o.menu_id
      GROUP BY o.order_date
    )
    SELECT order_date, revenue
    FROM daily
    ORDER BY order_date;
  hints:
    - "The main statement needs a `WHERE` that compares each day's `revenue` with one number: the average revenue of all days."
    - "That average is worked out from the same CTE with a subquery: `(SELECT AVG(revenue) FROM daily)`. The name `daily` may be used twice."
    - "Add before `ORDER BY`: `WHERE revenue > (SELECT AVG(revenue) FROM daily)`."
  tests:
    - output: |
        order_date|revenue
        2024-02-26|48000
        2024-03-01|65000
        2024-03-27|45000
        2024-04-01|60000
    - input: |
        INSERT INTO orders VALUES
          (13, '2024-04-03', 7, 4),
          (14, '2024-04-03', 2, 2);
      output: |
        order_date|revenue
        2024-03-01|65000
        2024-04-01|60000
        2024-04-03|130000
  solution: |
    WITH daily AS (
      SELECT o.order_date, SUM(m.price * o.quantity) AS revenue
      FROM orders o
      JOIN menu m ON m.id = o.menu_id
      GROUP BY o.order_date
    )
    SELECT order_date, revenue
    FROM daily
    WHERE revenue > (SELECT AVG(revenue) FROM daily)
    ORDER BY order_date;

- slug: each-items-share
  type: code
  title: Each item's share
  prompt: |
    What percentage of the shop's revenue comes from each item? Do it with two CTEs: `per_item` holds the `name` and `revenue` of every item that has been ordered, and `total` holds one row with a column `everything`, the sum of all revenue.

    Show three columns: `name`, `revenue`, and `percent`, which is `revenue * 100.0 / everything` rounded with `ROUND`. Sort from the highest `revenue`. When equal, sort by `name` in alphabetical order.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, name TEXT, category TEXT, price INTEGER);
    INSERT INTO menu VALUES
      (1, 'Black Coffee', 'drink', 10000),
      (2, 'Milk Coffee', 'drink', 15000),
      (3, 'Pulled Tea', 'drink', 12000),
      (4, 'Sweet Iced Tea', 'drink', 8000),
      (5, 'Toast', 'food', 18000),
      (6, 'Banana Fritters', 'food', 12000),
      (7, 'Fried Rice', 'food', 25000);
    CREATE TABLE orders (id INTEGER PRIMARY KEY, order_date TEXT, menu_id INTEGER, quantity INTEGER);
    INSERT INTO orders VALUES
      (1, '2024-02-26', 2, 2),
      (2, '2024-02-26', 5, 1),
      (3, '2024-02-28', 3, 3),
      (4, '2024-03-01', 2, 1),
      (5, '2024-03-01', 7, 2),
      (6, '2024-03-15', 1, 4),
      (7, '2024-03-27', 2, 3),
      (8, '2024-03-29', 6, 3),
      (9, '2024-03-31', 5, 2),
      (10, '2024-04-01', 2, 2),
      (11, '2024-04-01', 1, 3),
      (12, '2024-04-02', 7, 1);
  starter: |
    -- add the total CTE, then the percent column
    WITH per_item AS (
      SELECT m.name, SUM(m.price * o.quantity) AS revenue
      FROM orders o
      JOIN menu m ON m.id = o.menu_id
      GROUP BY m.id, m.name
    )
    SELECT name, revenue
    FROM per_item
    ORDER BY revenue DESC, name;
  hints:
    - "The second CTE is written after a comma behind the closing bracket of `per_item`, without repeating `WITH`, and may read from `per_item`."
    - "The second CTE: `total AS (SELECT SUM(revenue) AS everything FROM per_item)`. It holds one row, so its value can be fetched with the subquery `(SELECT everything FROM total)`."
    - "The third column: `ROUND(revenue * 100.0 / (SELECT everything FROM total)) AS percent`. The `100.0` keeps the division from being cut down to a whole number."
  tests:
    - output: |
        name|revenue|percent
        Milk Coffee|120000|31
        Fried Rice|75000|19
        Black Coffee|70000|18
        Toast|54000|14
        Banana Fritters|36000|9
        Pulled Tea|36000|9
    - input: |
        INSERT INTO menu VALUES (8, 'Orange Juice', 'drink', 14000);
        INSERT INTO orders VALUES
          (13, '2024-04-03', 8, 4),
          (14, '2024-04-03', 4, 3);
      output: |
        name|revenue|percent
        Milk Coffee|120000|25
        Fried Rice|75000|16
        Black Coffee|70000|15
        Orange Juice|56000|12
        Toast|54000|11
        Banana Fritters|36000|8
        Pulled Tea|36000|8
        Sweet Iced Tea|24000|5
  solution: |
    WITH per_item AS (
      SELECT m.name, SUM(m.price * o.quantity) AS revenue
      FROM orders o
      JOIN menu m ON m.id = o.menu_id
      GROUP BY m.id, m.name
    ),
    total AS (
      SELECT SUM(revenue) AS everything FROM per_item
    )
    SELECT name, revenue, ROUND(revenue * 100.0 / (SELECT everything FROM total)) AS percent
    FROM per_item
    ORDER BY revenue DESC, name;

- slug: how-long-a-cte-lives
  type: choice
  title: How long a CTE lives
  prompt: |
    The first statement runs fine. What happens when the second statement runs after it?

    ```sql
    WITH pricey AS (
      SELECT name, price FROM menu WHERE price > 15000
    )
    SELECT COUNT(*) AS how_many FROM pricey;

    SELECT name FROM pricey;
    ```
  options:
    - "It shows the names of the items that cost more than 15000"
    - "It shows the names of all items"
    - "It fails, because `pricey` only exists in the statement that holds its `WITH`"
    - "It shows no rows at all, without an error message"
  correct: [2]
  hint: "A CTE is not a stored table. For how long is a name from `WITH` valid?"
  explanation: "A CTE only lives for one statement, up to the semicolon. The second statement is a new one without a `WITH`, so the database looks for a table called `pricey`, does not find it, and reports `no such table: pricey`. If you need it again, write the `WITH` again in that statement."
