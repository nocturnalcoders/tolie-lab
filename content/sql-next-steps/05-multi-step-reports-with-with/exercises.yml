- slug: the-busy-days
  type: code
  title: Hari yang ramai
  prompt: |
    Bu Rina ingin tahu hari mana saja yang omzetnya **di atas rata-rata omzet harian**. Kerjakan dalam dua langkah: CTE `harian` berisi omzet tiap tanggal, lalu perintah utama memilih hari yang omzetnya lebih besar dari rata-rata `omzet` di `harian`.

    Tampilkan `tanggal` dan `omzet`. Urutkan menurut `tanggal`.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
    CREATE TABLE pesanan (id INTEGER PRIMARY KEY, tanggal TEXT, menu_id INTEGER, jumlah INTEGER);
    INSERT INTO pesanan VALUES
      (1, '2024-02-26', 2, 2),
      (2, '2024-02-26', 5, 1),
      (3, '2024-02-28', 3, 3),
      (4, '2024-03-01', 2, 1),
      (5, '2024-03-01', 7, 2),
      (6, '2024-03-15', 1, 4),
      (7, '2024-03-27', 2, 3),
      (8, '2024-03-29', 6, 3),
      (9, '2024-03-31', 5, 2),
      (10, '2024-04-01', 2, 2),
      (11, '2024-04-01', 1, 3),
      (12, '2024-04-02', 7, 1);
  starter: |
    -- CTE harian sudah jadi; saring hari yang omzetnya di atas rata-rata
    WITH harian AS (
      SELECT p.tanggal, SUM(m.harga * p.jumlah) AS omzet
      FROM pesanan p
      JOIN menu m ON m.id = p.menu_id
      GROUP BY p.tanggal
    )
    SELECT tanggal, omzet
    FROM harian
    ORDER BY tanggal;
  hints:
    - "Perintah utama perlu `WHERE` yang membandingkan `omzet` tiap hari dengan satu angka: rata-rata omzet semua hari."
    - "Rata-rata itu dihitung dari CTE yang sama dengan subquery: `(SELECT AVG(omzet) FROM harian)`. Nama `harian` boleh dipakai dua kali."
    - "Tambahkan sebelum `ORDER BY`: `WHERE omzet > (SELECT AVG(omzet) FROM harian)`."
  tests:
    - output: |
        tanggal|omzet
        2024-02-26|48000
        2024-03-01|65000
        2024-03-27|45000
        2024-04-01|60000
    - input: |
        INSERT INTO pesanan VALUES
          (13, '2024-04-03', 7, 4),
          (14, '2024-04-03', 2, 2);
      output: |
        tanggal|omzet
        2024-03-01|65000
        2024-04-01|60000
        2024-04-03|130000
  solution: |
    WITH harian AS (
      SELECT p.tanggal, SUM(m.harga * p.jumlah) AS omzet
      FROM pesanan p
      JOIN menu m ON m.id = p.menu_id
      GROUP BY p.tanggal
    )
    SELECT tanggal, omzet
    FROM harian
    WHERE omzet > (SELECT AVG(omzet) FROM harian)
    ORDER BY tanggal;

- slug: each-items-share
  type: code
  title: Andil tiap menu
  prompt: |
    Berapa persen omzet warung berasal dari tiap menu? Kerjakan dengan dua CTE: `per_menu` berisi `nama` dan `omzet` tiap menu yang pernah dipesan, dan `total` berisi satu baris dengan kolom `semua`, yaitu jumlah seluruh omzet.

    Tampilkan tiga kolom: `nama`, `omzet`, dan `persen`, yaitu `omzet * 100.0 / semua` yang dibulatkan dengan `ROUND`. Urutkan dari `omzet` terbesar. Bila sama, urutkan menurut `nama` sesuai abjad.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
    CREATE TABLE pesanan (id INTEGER PRIMARY KEY, tanggal TEXT, menu_id INTEGER, jumlah INTEGER);
    INSERT INTO pesanan VALUES
      (1, '2024-02-26', 2, 2),
      (2, '2024-02-26', 5, 1),
      (3, '2024-02-28', 3, 3),
      (4, '2024-03-01', 2, 1),
      (5, '2024-03-01', 7, 2),
      (6, '2024-03-15', 1, 4),
      (7, '2024-03-27', 2, 3),
      (8, '2024-03-29', 6, 3),
      (9, '2024-03-31', 5, 2),
      (10, '2024-04-01', 2, 2),
      (11, '2024-04-01', 1, 3),
      (12, '2024-04-02', 7, 1);
  starter: |
    -- tambahkan CTE total, lalu kolom persen
    WITH per_menu AS (
      SELECT m.nama, SUM(m.harga * p.jumlah) AS omzet
      FROM pesanan p
      JOIN menu m ON m.id = p.menu_id
      GROUP BY m.id, m.nama
    )
    SELECT nama, omzet
    FROM per_menu
    ORDER BY omzet DESC, nama;
  hints:
    - "CTE kedua ditulis setelah koma di belakang kurung tutup `per_menu`, tanpa mengulang `WITH`, dan boleh membaca dari `per_menu`."
    - "CTE kedua: `total AS (SELECT SUM(omzet) AS semua FROM per_menu)`. Isinya satu baris, jadi nilainya bisa diambil dengan subquery `(SELECT semua FROM total)`."
    - "Kolom ketiga: `ROUND(omzet * 100.0 / (SELECT semua FROM total)) AS persen`. Angka `100.0` membuat pembagiannya tidak dipotong menjadi bilangan bulat."
  tests:
    - output: |
        nama|omzet|persen
        Kopi Susu|120000|31
        Nasi Goreng|75000|19
        Kopi Hitam|70000|18
        Roti Bakar|54000|14
        Pisang Goreng|36000|9
        Teh Tarik|36000|9
    - input: |
        INSERT INTO menu VALUES (8, 'Jus Jeruk', 'minuman', 14000);
        INSERT INTO pesanan VALUES
          (13, '2024-04-03', 8, 4),
          (14, '2024-04-03', 4, 3);
      output: |
        nama|omzet|persen
        Kopi Susu|120000|25
        Nasi Goreng|75000|16
        Kopi Hitam|70000|15
        Jus Jeruk|56000|12
        Roti Bakar|54000|11
        Pisang Goreng|36000|8
        Teh Tarik|36000|8
        Es Teh Manis|24000|5
  solution: |
    WITH per_menu AS (
      SELECT m.nama, SUM(m.harga * p.jumlah) AS omzet
      FROM pesanan p
      JOIN menu m ON m.id = p.menu_id
      GROUP BY m.id, m.nama
    ),
    total AS (
      SELECT SUM(omzet) AS semua FROM per_menu
    )
    SELECT nama, omzet, ROUND(omzet * 100.0 / (SELECT semua FROM total)) AS persen
    FROM per_menu
    ORDER BY omzet DESC, nama;

- slug: how-long-a-cte-lives
  type: choice
  title: Umur sebuah CTE
  prompt: |
    Perintah pertama berjalan dengan baik. Apa yang terjadi saat perintah kedua dijalankan setelahnya?

    ```sql
    WITH mahal AS (
      SELECT nama, harga FROM menu WHERE harga > 15000
    )
    SELECT COUNT(*) AS banyak FROM mahal;

    SELECT nama FROM mahal;
    ```
  options:
    - "Menampilkan nama menu yang harganya di atas 15000"
    - "Menampilkan semua nama menu"
    - "Gagal, karena `mahal` hanya ada di perintah yang memuat `WITH`-nya"
    - "Tidak menampilkan baris apa pun, tanpa pesan kesalahan"
  correct: [2]
  hint: "CTE bukan tabel yang tersimpan. Sampai kapan sebuah nama dari `WITH` berlaku?"
  explanation: "CTE hanya hidup selama satu perintah, sampai titik koma. Perintah kedua adalah perintah baru yang tidak punya `WITH`, jadi database mencari tabel bernama `mahal`, tidak menemukannya, dan melaporkan `no such table: mahal`. Kalau butuh lagi, tulis ulang `WITH`-nya di perintah itu."
