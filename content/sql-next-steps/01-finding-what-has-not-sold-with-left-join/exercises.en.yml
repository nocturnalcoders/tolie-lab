- slug: items-nobody-has-ordered
  type: code
  title: Items nobody has ordered
  prompt: |
    Ms. Rina wants a list of the menu items that have never been ordered at all. Show the `name` and `price` of every item that does not have a single row in the `orders` table. Sort by the item `id`.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, name TEXT, category TEXT, price INTEGER);
    INSERT INTO menu VALUES
      (1, 'Black Coffee', 'drink', 10000),
      (2, 'Milk Coffee', 'drink', 15000),
      (3, 'Pulled Tea', 'drink', 12000),
      (4, 'Sweet Iced Tea', 'drink', 8000),
      (5, 'Toast', 'food', 18000),
      (6, 'Banana Fritters', 'food', 12000),
      (7, 'Fried Rice', 'food', 25000);
    CREATE TABLE orders (id INTEGER PRIMARY KEY, order_date TEXT, menu_id INTEGER, quantity INTEGER);
    INSERT INTO orders VALUES
      (1, '2024-03-04', 2, 2),
      (2, '2024-03-04', 5, 1),
      (3, '2024-03-04', 3, 3),
      (4, '2024-03-04', 2, 1),
      (5, '2024-03-05', 7, 2),
      (6, '2024-03-05', 1, 4),
      (7, '2024-03-05', 2, 3),
      (8, '2024-03-05', 6, 2);
  starter: |
    -- the LEFT JOIN is already there; keep only the items without an order
    SELECT m.name, m.price
    FROM menu m
    LEFT JOIN orders o ON o.menu_id = m.id
    ORDER BY m.id;
  hints:
    - "After a `LEFT JOIN`, an item without orders is still shown, but every column from `orders` on that row is `NULL`. That is the mark you can filter on."
    - "Add a `WHERE` before `ORDER BY`. A `NULL` is tested with `IS NULL`, not `= NULL`."
    - "The condition: `WHERE o.id IS NULL`."
  tests:
    - output: |
        name|price
        Sweet Iced Tea|8000
    - input: |
        INSERT INTO menu VALUES
          (8, 'Orange Juice', 'drink', 14000),
          (9, 'Noodle Soup', 'food', 20000);
        INSERT INTO orders VALUES (9, '2024-03-06', 4, 2);
      output: |
        name|price
        Orange Juice|14000
        Noodle Soup|20000
  solution: |
    SELECT m.name, m.price
    FROM menu m
    LEFT JOIN orders o ON o.menu_id = m.id
    WHERE o.id IS NULL
    ORDER BY m.id;

- slug: servings-sold-for-every-item
  type: code
  title: Servings sold for every item
  prompt: |
    Build a list of servings sold that holds **every** menu item, including the ones nobody has ordered. Show two columns:

    - `name`: the item name
    - `sold`: the sum of all servings ordered, or `0` when the item has never been ordered

    Sort from the highest `sold`. When equal, sort by `name` in alphabetical order.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, name TEXT, category TEXT, price INTEGER);
    INSERT INTO menu VALUES
      (1, 'Black Coffee', 'drink', 10000),
      (2, 'Milk Coffee', 'drink', 15000),
      (3, 'Pulled Tea', 'drink', 12000),
      (4, 'Sweet Iced Tea', 'drink', 8000),
      (5, 'Toast', 'food', 18000),
      (6, 'Banana Fritters', 'food', 12000),
      (7, 'Fried Rice', 'food', 25000);
    CREATE TABLE orders (id INTEGER PRIMARY KEY, order_date TEXT, menu_id INTEGER, quantity INTEGER);
    INSERT INTO orders VALUES
      (1, '2024-03-04', 2, 2),
      (2, '2024-03-04', 5, 1),
      (3, '2024-03-04', 3, 3),
      (4, '2024-03-04', 2, 1),
      (5, '2024-03-05', 7, 2),
      (6, '2024-03-05', 1, 4),
      (7, '2024-03-05', 2, 3),
      (8, '2024-03-05', 6, 2);
  starter: |
    -- a plain JOIN drops the items nobody ordered; fix it so every item is shown
    SELECT m.name, SUM(o.quantity) AS sold
    FROM menu m
    JOIN orders o ON o.menu_id = m.id
    GROUP BY m.id, m.name
    ORDER BY sold DESC, m.name;
  hints:
    - "Two things need to change: the kind of join, so that items without orders are not dropped, and the `sold` value for those items, so that it is 0 and not `NULL`."
    - "Change `JOIN` into `LEFT JOIN`. For an item without orders, `SUM(o.quantity)` gives `NULL`, and `COALESCE(value, 0)` replaces it with 0."
    - "The second column: `COALESCE(SUM(o.quantity), 0) AS sold`."
  tests:
    - output: |
        name|sold
        Milk Coffee|6
        Black Coffee|4
        Pulled Tea|3
        Banana Fritters|2
        Fried Rice|2
        Toast|1
        Sweet Iced Tea|0
    - input: |
        INSERT INTO menu VALUES (8, 'Orange Juice', 'drink', 14000);
        INSERT INTO orders VALUES
          (9, '2024-03-06', 5, 3),
          (10, '2024-03-06', 4, 2);
      output: |
        name|sold
        Milk Coffee|6
        Black Coffee|4
        Toast|4
        Pulled Tea|3
        Banana Fritters|2
        Fried Rice|2
        Sweet Iced Tea|2
        Orange Juice|0
  solution: |
    SELECT m.name, COALESCE(SUM(o.quantity), 0) AS sold
    FROM menu m
    LEFT JOIN orders o ON o.menu_id = m.id
    GROUP BY m.id, m.name
    ORDER BY sold DESC, m.name;

- slug: counting-after-a-left-join
  type: choice
  title: Counting after a LEFT JOIN
  prompt: |
    Sweet Iced Tea has never been ordered. What are `a` and `b` on the Sweet Iced Tea row in the result of this statement?

    ```sql
    SELECT m.name, COUNT(*) AS a, COUNT(o.id) AS b
    FROM menu m
    LEFT JOIN orders o ON o.menu_id = m.id
    GROUP BY m.id, m.name;
    ```
  options:
    - "`a` = 0 and `b` = 0"
    - "`a` = 1 and `b` = 0"
    - "`a` = 1 and `b` = 1"
    - "Sweet Iced Tea is not shown at all"
  correct: [1]
  hint: "`LEFT JOIN` still makes one row for an item without orders. What does `o.id` hold on that row?"
  explanation: "`LEFT JOIN` makes one row for Sweet Iced Tea with `NULL` order columns. `COUNT(*)` counts that row, so `a` = 1. `COUNT(o.id)` only counts values that are not `NULL`, so `b` = 0. To count the orders per item, use `COUNT(o.id)`."
