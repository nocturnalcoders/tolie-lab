- slug: items-nobody-has-ordered
  type: code
  title: Menu yang belum dipesan
  prompt: |
    Bu Rina ingin daftar menu yang belum pernah dipesan sama sekali. Tampilkan `nama` dan `harga` setiap menu yang tidak punya satu pun baris di tabel `pesanan`. Urutkan menurut `id` menu.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
    CREATE TABLE pesanan (id INTEGER PRIMARY KEY, tanggal TEXT, menu_id INTEGER, jumlah INTEGER);
    INSERT INTO pesanan VALUES
      (1, '2024-03-04', 2, 2),
      (2, '2024-03-04', 5, 1),
      (3, '2024-03-04', 3, 3),
      (4, '2024-03-04', 2, 1),
      (5, '2024-03-05', 7, 2),
      (6, '2024-03-05', 1, 4),
      (7, '2024-03-05', 2, 3),
      (8, '2024-03-05', 6, 2);
  starter: |
    -- LEFT JOIN sudah ada; sisakan hanya menu yang tidak punya pesanan
    SELECT m.nama, m.harga
    FROM menu m
    LEFT JOIN pesanan p ON p.menu_id = m.id
    ORDER BY m.id;
  hints:
    - "Setelah `LEFT JOIN`, menu tanpa pesanan tetap tampil, tetapi semua kolom dari `pesanan` di baris itu bernilai `NULL`. Itu ciri yang bisa disaring."
    - "Tambahkan `WHERE` sebelum `ORDER BY`. Nilai `NULL` diperiksa dengan `IS NULL`, bukan `= NULL`."
    - "Syaratnya: `WHERE p.id IS NULL`."
  tests:
    - output: |
        nama|harga
        Es Teh Manis|8000
    - input: |
        INSERT INTO menu VALUES
          (8, 'Jus Jeruk', 'minuman', 14000),
          (9, 'Mie Rebus', 'makanan', 20000);
        INSERT INTO pesanan VALUES (9, '2024-03-06', 4, 2);
      output: |
        nama|harga
        Jus Jeruk|14000
        Mie Rebus|20000
  solution: |
    SELECT m.nama, m.harga
    FROM menu m
    LEFT JOIN pesanan p ON p.menu_id = m.id
    WHERE p.id IS NULL
    ORDER BY m.id;

- slug: servings-sold-for-every-item
  type: code
  title: Porsi terjual untuk semua menu
  prompt: |
    Buat daftar porsi terjual yang memuat **semua** menu, termasuk yang belum pernah dipesan. Tampilkan dua kolom:

    - `nama`: nama menu
    - `terjual`: jumlah semua porsi yang dipesan, atau `0` bila belum pernah dipesan

    Urutkan dari `terjual` terbanyak. Bila sama, urutkan menurut `nama` sesuai abjad.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
    CREATE TABLE pesanan (id INTEGER PRIMARY KEY, tanggal TEXT, menu_id INTEGER, jumlah INTEGER);
    INSERT INTO pesanan VALUES
      (1, '2024-03-04', 2, 2),
      (2, '2024-03-04', 5, 1),
      (3, '2024-03-04', 3, 3),
      (4, '2024-03-04', 2, 1),
      (5, '2024-03-05', 7, 2),
      (6, '2024-03-05', 1, 4),
      (7, '2024-03-05', 2, 3),
      (8, '2024-03-05', 6, 2);
  starter: |
    -- JOIN biasa membuang menu yang belum dipesan; perbaiki supaya semua menu tampil
    SELECT m.nama, SUM(p.jumlah) AS terjual
    FROM menu m
    JOIN pesanan p ON p.menu_id = m.id
    GROUP BY m.id, m.nama
    ORDER BY terjual DESC, m.nama;
  hints:
    - "Ada dua hal yang perlu diubah: jenis gabungannya, supaya menu tanpa pesanan tidak terbuang, dan nilai `terjual` untuk menu itu, supaya 0 dan bukan `NULL`."
    - "Ganti `JOIN` menjadi `LEFT JOIN`. Untuk menu tanpa pesanan, `SUM(p.jumlah)` menghasilkan `NULL`, dan `COALESCE(nilai, 0)` menggantinya dengan 0."
    - "Kolom keduanya: `COALESCE(SUM(p.jumlah), 0) AS terjual`."
  tests:
    - output: |
        nama|terjual
        Kopi Susu|6
        Kopi Hitam|4
        Teh Tarik|3
        Nasi Goreng|2
        Pisang Goreng|2
        Roti Bakar|1
        Es Teh Manis|0
    - input: |
        INSERT INTO menu VALUES (8, 'Jus Jeruk', 'minuman', 14000);
        INSERT INTO pesanan VALUES
          (9, '2024-03-06', 5, 3),
          (10, '2024-03-06', 4, 2);
      output: |
        nama|terjual
        Kopi Susu|6
        Kopi Hitam|4
        Roti Bakar|4
        Teh Tarik|3
        Es Teh Manis|2
        Nasi Goreng|2
        Pisang Goreng|2
        Jus Jeruk|0
  solution: |
    SELECT m.nama, COALESCE(SUM(p.jumlah), 0) AS terjual
    FROM menu m
    LEFT JOIN pesanan p ON p.menu_id = m.id
    GROUP BY m.id, m.nama
    ORDER BY terjual DESC, m.nama;

- slug: counting-after-a-left-join
  type: choice
  title: Menghitung setelah LEFT JOIN
  prompt: |
    Es Teh Manis belum pernah dipesan. Berapa nilai `a` dan `b` pada baris Es Teh Manis di hasil perintah ini?

    ```sql
    SELECT m.nama, COUNT(*) AS a, COUNT(p.id) AS b
    FROM menu m
    LEFT JOIN pesanan p ON p.menu_id = m.id
    GROUP BY m.id, m.nama;
    ```
  options:
    - "`a` = 0 dan `b` = 0"
    - "`a` = 1 dan `b` = 0"
    - "`a` = 1 dan `b` = 1"
    - "Es Teh Manis tidak tampil sama sekali"
  correct: [1]
  hint: "`LEFT JOIN` tetap membuat satu baris untuk menu tanpa pesanan. Apa isi `p.id` di baris itu?"
  explanation: "`LEFT JOIN` membuat satu baris untuk Es Teh Manis dengan kolom pesanan `NULL`. `COUNT(*)` menghitung baris itu, jadi `a` = 1. `COUNT(p.id)` hanya menghitung nilai yang bukan `NULL`, jadi `b` = 0. Untuk menghitung jumlah pesanan per menu, pakai `COUNT(p.id)`."
