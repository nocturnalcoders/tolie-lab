- slug: price-groups
  type: code
  title: Price groups
  prompt: |
    Ms. Rina wants every menu item to get a price group. From the `menu` table, show `name`, `price`, and a column `price_group` that holds:

    - `cheap` when the price is below 10000
    - `medium` when the price is 10000 up to 15000
    - `expensive` when the price is above 15000

    Sort by `id`.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, name TEXT, category TEXT, price INTEGER);
    INSERT INTO menu VALUES
      (1, 'Black Coffee', 'drink', 10000),
      (2, 'Milk Coffee', 'drink', 15000),
      (3, 'Pulled Tea', 'drink', 12000),
      (4, 'Sweet Iced Tea', 'drink', 8000),
      (5, 'Toast', 'food', 18000),
      (6, 'Banana Fritters', 'food', 12000),
      (7, 'Fried Rice', 'food', 25000);
  starter: |
    -- there are only two groups so far; add the medium group
    SELECT name, price,
      CASE
        WHEN price < 10000 THEN 'cheap'
        ELSE 'expensive'
      END AS price_group
    FROM menu
    ORDER BY id;
  hints:
    - "A `CASE` may have more than one `WHEN`. The conditions are tested from the top, and the first one that is true is used."
    - "Add one `WHEN` between `cheap` and `ELSE`. Prices below 10000 are already caught by the first line, so the second condition only needs to test the upper limit."
    - "The extra line: `WHEN price <= 15000 THEN 'medium'`."
  tests:
    - output: |
        name|price|price_group
        Black Coffee|10000|medium
        Milk Coffee|15000|medium
        Pulled Tea|12000|medium
        Sweet Iced Tea|8000|cheap
        Toast|18000|expensive
        Banana Fritters|12000|medium
        Fried Rice|25000|expensive
    - input: |
        INSERT INTO menu VALUES
          (8, 'Mineral Water', 'drink', 5000),
          (9, 'Noodle Soup', 'food', 16000);
      output: |
        name|price|price_group
        Black Coffee|10000|medium
        Milk Coffee|15000|medium
        Pulled Tea|12000|medium
        Sweet Iced Tea|8000|cheap
        Toast|18000|expensive
        Banana Fritters|12000|medium
        Fried Rice|25000|expensive
        Mineral Water|5000|cheap
        Noodle Soup|16000|expensive
  solution: |
    SELECT name, price,
      CASE
        WHEN price < 10000 THEN 'cheap'
        WHEN price <= 15000 THEN 'medium'
        ELSE 'expensive'
      END AS price_group
    FROM menu
    ORDER BY id;

- slug: drink-and-food-revenue-per-day
  type: code
  title: Drink and food revenue per day
  prompt: |
    Build a daily summary that splits revenue into drinks and food. Join `orders` with `menu`, then show one row per date with three columns:

    - `order_date`
    - `drinks`: the sum of price times quantity for items in the `drink` category
    - `food`: the sum of price times quantity for items in the `food` category

    A day without orders in one of the categories must show `0`, not `NULL`. Sort by `order_date`.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, name TEXT, category TEXT, price INTEGER);
    INSERT INTO menu VALUES
      (1, 'Black Coffee', 'drink', 10000),
      (2, 'Milk Coffee', 'drink', 15000),
      (3, 'Pulled Tea', 'drink', 12000),
      (4, 'Sweet Iced Tea', 'drink', 8000),
      (5, 'Toast', 'food', 18000),
      (6, 'Banana Fritters', 'food', 12000),
      (7, 'Fried Rice', 'food', 25000);
    CREATE TABLE orders (id INTEGER PRIMARY KEY, order_date TEXT, menu_id INTEGER, quantity INTEGER);
    INSERT INTO orders VALUES
      (1, '2024-03-04', 2, 2),
      (2, '2024-03-04', 5, 1),
      (3, '2024-03-04', 3, 3),
      (4, '2024-03-04', 2, 1),
      (5, '2024-03-05', 7, 2),
      (6, '2024-03-05', 1, 4),
      (7, '2024-03-05', 2, 3),
      (8, '2024-03-05', 6, 2);
  starter: |
    -- the drinks column still adds up every order; split it with CASE
    SELECT o.order_date,
      SUM(m.price * o.quantity) AS drinks
    FROM orders o
    JOIN menu m ON m.id = o.menu_id
    GROUP BY o.order_date
    ORDER BY o.order_date;
  hints:
    - "Put a `CASE` inside the `SUM`: an order in the right category contributes `m.price * o.quantity`, every other order contributes 0."
    - "The drinks column: `SUM(CASE WHEN m.category = 'drink' THEN m.price * o.quantity ELSE 0 END) AS drinks`. Do not forget `ELSE 0`, so a day without drinks does not turn into `NULL`."
    - "The food column is exactly the same, with `'drink'` replaced by `'food'` and the name `AS food`. Separate the two columns with a comma."
  tests:
    - output: |
        order_date|drinks|food
        2024-03-04|81000|18000
        2024-03-05|85000|74000
    - input: |
        INSERT INTO orders VALUES
          (9, '2024-03-05', 5, 1),
          (10, '2024-03-06', 1, 2),
          (11, '2024-03-06', 4, 3);
      output: |
        order_date|drinks|food
        2024-03-04|81000|18000
        2024-03-05|85000|92000
        2024-03-06|44000|0
  solution: |
    SELECT o.order_date,
      SUM(CASE WHEN m.category = 'drink' THEN m.price * o.quantity ELSE 0 END) AS drinks,
      SUM(CASE WHEN m.category = 'food' THEN m.price * o.quantity ELSE 0 END) AS food
    FROM orders o
    JOIN menu m ON m.id = o.menu_id
    GROUP BY o.order_date
    ORDER BY o.order_date;

- slug: the-order-of-when
  type: choice
  title: The order of WHEN
  prompt: |
    Fried Rice costs 25000. What does the `price_group` column hold for Fried Rice?

    ```sql
    SELECT name,
      CASE
        WHEN price >= 10000 THEN 'medium'
        WHEN price >= 20000 THEN 'expensive'
        ELSE 'cheap'
      END AS price_group
    FROM menu;
    ```
  options:
    - "`expensive`"
    - "`medium`"
    - "`cheap`"
    - "`NULL`"
  correct: [1]
  hint: "`CASE` stops at the first condition that is true, reading from the top."
  explanation: "25000 meets `price >= 10000`, so `CASE` uses `medium` right away and never reaches the second line. In this order no item can ever become `expensive`. The fix: write the strictest condition first, which is `price >= 20000`."
