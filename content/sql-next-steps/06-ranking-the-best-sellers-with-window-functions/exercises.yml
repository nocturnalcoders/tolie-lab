- slug: running-revenue
  type: code
  title: Omzet berjalan
  prompt: |
    Bu Rina ingin melihat omzet tiap hari sekaligus jumlahnya sejak hari pertama. CTE `harian` sudah menghitung omzet per tanggal. Tampilkan tiga kolom:

    - `tanggal`
    - `omzet`: omzet hari itu
    - `berjalan`: jumlah `omzet` dari tanggal paling awal sampai tanggal itu

    Urutkan menurut `tanggal`.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
    CREATE TABLE pesanan (id INTEGER PRIMARY KEY, tanggal TEXT, menu_id INTEGER, jumlah INTEGER);
    INSERT INTO pesanan VALUES
      (1, '2024-02-26', 2, 2),
      (2, '2024-02-26', 5, 1),
      (3, '2024-02-28', 3, 3),
      (4, '2024-03-01', 2, 1),
      (5, '2024-03-01', 7, 2),
      (6, '2024-03-15', 1, 4),
      (7, '2024-03-27', 2, 3),
      (8, '2024-03-29', 6, 3),
      (9, '2024-03-31', 5, 2),
      (10, '2024-04-01', 2, 2),
      (11, '2024-04-01', 1, 3),
      (12, '2024-04-02', 7, 1);
  starter: |
    -- tambahkan kolom berjalan dengan fungsi window
    WITH harian AS (
      SELECT p.tanggal, SUM(m.harga * p.jumlah) AS omzet
      FROM pesanan p
      JOIN menu m ON m.id = p.menu_id
      GROUP BY p.tanggal
    )
    SELECT tanggal, omzet
    FROM harian
    ORDER BY tanggal;
  hints:
    - "Jumlah berjalan adalah `SUM` yang diberi `OVER`. Barisnya tidak diringkas: setiap tanggal tetap tampil dan mendapat jumlah sampai tanggal itu."
    - "Di dalam `OVER`, tulis urutan yang dipakai untuk menjumlahkan: `OVER (ORDER BY tanggal)`."
    - "Kolom ketiganya: `SUM(omzet) OVER (ORDER BY tanggal) AS berjalan`."
  tests:
    - output: |
        tanggal|omzet|berjalan
        2024-02-26|48000|48000
        2024-02-28|36000|84000
        2024-03-01|65000|149000
        2024-03-15|40000|189000
        2024-03-27|45000|234000
        2024-03-29|36000|270000
        2024-03-31|36000|306000
        2024-04-01|60000|366000
        2024-04-02|25000|391000
    - input: |
        INSERT INTO pesanan VALUES
          (13, '2024-03-10', 5, 1),
          (14, '2024-04-03', 3, 2);
      output: |
        tanggal|omzet|berjalan
        2024-02-26|48000|48000
        2024-02-28|36000|84000
        2024-03-01|65000|149000
        2024-03-10|18000|167000
        2024-03-15|40000|207000
        2024-03-27|45000|252000
        2024-03-29|36000|288000
        2024-03-31|36000|324000
        2024-04-01|60000|384000
        2024-04-02|25000|409000
        2024-04-03|24000|433000
  solution: |
    WITH harian AS (
      SELECT p.tanggal, SUM(m.harga * p.jumlah) AS omzet
      FROM pesanan p
      JOIN menu m ON m.id = p.menu_id
      GROUP BY p.tanggal
    )
    SELECT tanggal, omzet, SUM(omzet) OVER (ORDER BY tanggal) AS berjalan
    FROM harian
    ORDER BY tanggal;

- slug: the-best-seller-report
  type: code
  title: Laporan menu terlaris
  prompt: |
    Saatnya menyusun laporan akhir untuk Bu Rina, dengan semua yang sudah kamu pelajari. Tampilkan **semua** menu, termasuk yang belum pernah dipesan, dengan empat kolom:

    - `peringkat`: peringkat menurut `omzet` terbesar, memakai `RANK()`
    - `nama`: nama menu
    - `terjual`: jumlah semua porsi yang dipesan, `0` bila belum pernah dipesan
    - `omzet`: jumlah dari harga dikali jumlah, `0` bila belum pernah dipesan

    Urutkan menurut `peringkat`. Bila sama, urutkan menurut `nama` sesuai abjad.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, nama TEXT, kategori TEXT, harga INTEGER);
    INSERT INTO menu VALUES
      (1, 'Kopi Hitam', 'minuman', 10000),
      (2, 'Kopi Susu', 'minuman', 15000),
      (3, 'Teh Tarik', 'minuman', 12000),
      (4, 'Es Teh Manis', 'minuman', 8000),
      (5, 'Roti Bakar', 'makanan', 18000),
      (6, 'Pisang Goreng', 'makanan', 12000),
      (7, 'Nasi Goreng', 'makanan', 25000);
    CREATE TABLE pesanan (id INTEGER PRIMARY KEY, tanggal TEXT, menu_id INTEGER, jumlah INTEGER);
    INSERT INTO pesanan VALUES
      (1, '2024-02-26', 2, 2),
      (2, '2024-02-26', 5, 1),
      (3, '2024-02-28', 3, 3),
      (4, '2024-03-01', 2, 1),
      (5, '2024-03-01', 7, 2),
      (6, '2024-03-15', 1, 4),
      (7, '2024-03-27', 2, 3),
      (8, '2024-03-29', 6, 3),
      (9, '2024-03-31', 5, 2),
      (10, '2024-04-01', 2, 2),
      (11, '2024-04-01', 1, 3),
      (12, '2024-04-02', 7, 1);
  starter: |
    -- lengkapi: semua menu harus tampil (0 bila belum dipesan), lalu tambahkan peringkat
    WITH per_menu AS (
      SELECT m.nama, SUM(p.jumlah) AS terjual, SUM(m.harga * p.jumlah) AS omzet
      FROM menu m
      JOIN pesanan p ON p.menu_id = m.id
      GROUP BY m.id, m.nama
    )
    SELECT nama, terjual, omzet
    FROM per_menu
    ORDER BY omzet DESC, nama;
  hints:
    - "Kerjakan bertahap. Pertama perbaiki CTE supaya menu tanpa pesanan ikut tampil dengan angka 0, seperti di pelajaran 1. Setelah itu baru tambahkan peringkat di perintah utama."
    - "Di CTE: ganti `JOIN` menjadi `LEFT JOIN`, lalu bungkus kedua `SUM` dengan `COALESCE(..., 0)`. Peringkat dihitung dengan `RANK() OVER (ORDER BY omzet DESC)`."
    - "Perintah utamanya: `SELECT RANK() OVER (ORDER BY omzet DESC) AS peringkat, nama, terjual, omzet FROM per_menu ORDER BY peringkat, nama;`"
  tests:
    - output: |
        peringkat|nama|terjual|omzet
        1|Kopi Susu|8|120000
        2|Nasi Goreng|3|75000
        3|Kopi Hitam|7|70000
        4|Roti Bakar|3|54000
        5|Pisang Goreng|3|36000
        5|Teh Tarik|3|36000
        7|Es Teh Manis|0|0
    - input: |
        INSERT INTO menu VALUES (8, 'Jus Jeruk', 'minuman', 14000);
        INSERT INTO pesanan VALUES
          (13, '2024-04-03', 4, 5),
          (14, '2024-04-03', 7, 2),
          (15, '2024-04-03', 5, 1);
      output: |
        peringkat|nama|terjual|omzet
        1|Nasi Goreng|5|125000
        2|Kopi Susu|8|120000
        3|Roti Bakar|4|72000
        4|Kopi Hitam|7|70000
        5|Es Teh Manis|5|40000
        6|Pisang Goreng|3|36000
        6|Teh Tarik|3|36000
        8|Jus Jeruk|0|0
  solution: |
    WITH per_menu AS (
      SELECT m.nama,
             COALESCE(SUM(p.jumlah), 0) AS terjual,
             COALESCE(SUM(m.harga * p.jumlah), 0) AS omzet
      FROM menu m
      LEFT JOIN pesanan p ON p.menu_id = m.id
      GROUP BY m.id, m.nama
    )
    SELECT RANK() OVER (ORDER BY omzet DESC) AS peringkat, nama, terjual, omzet
    FROM per_menu
    ORDER BY peringkat, nama;

- slug: equal-ranks
  type: choice
  title: Peringkat yang sama
  prompt: |
    Empat menu punya omzet 90000, 50000, 50000, dan 40000. Peringkat apa yang diberikan `RANK() OVER (ORDER BY omzet DESC)` kepada keempatnya, berurutan?
  options:
    - "1, 2, 3, 4"
    - "1, 2, 2, 3"
    - "1, 2, 2, 4"
    - "1, 3, 3, 4"
  correct: [2]
  hint: "Nilai yang sama mendapat peringkat yang sama. Lalu, berapa menu yang omzetnya lebih besar dari menu terakhir?"
  explanation: "Dua menu beromzet 50000 sama-sama berperingkat 2. Menu terakhir berperingkat 4, bukan 3, karena ada tiga menu di atasnya: `RANK` melompati nomor yang terpakai oleh nilai kembar. Itu sebabnya di laporanmu Es Teh Manis berperingkat 7 setelah dua menu di peringkat 5."
