- slug: running-revenue
  type: code
  title: Running revenue
  prompt: |
    Ms. Rina wants to see the revenue of each day together with the total since the first day. The CTE `daily` already works out the revenue per date. Show three columns:

    - `order_date`
    - `revenue`: the revenue of that day
    - `running`: the sum of `revenue` from the earliest date up to that date

    Sort by `order_date`.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, name TEXT, category TEXT, price INTEGER);
    INSERT INTO menu VALUES
      (1, 'Black Coffee', 'drink', 10000),
      (2, 'Milk Coffee', 'drink', 15000),
      (3, 'Pulled Tea', 'drink', 12000),
      (4, 'Sweet Iced Tea', 'drink', 8000),
      (5, 'Toast', 'food', 18000),
      (6, 'Banana Fritters', 'food', 12000),
      (7, 'Fried Rice', 'food', 25000);
    CREATE TABLE orders (id INTEGER PRIMARY KEY, order_date TEXT, menu_id INTEGER, quantity INTEGER);
    INSERT INTO orders VALUES
      (1, '2024-02-26', 2, 2),
      (2, '2024-02-26', 5, 1),
      (3, '2024-02-28', 3, 3),
      (4, '2024-03-01', 2, 1),
      (5, '2024-03-01', 7, 2),
      (6, '2024-03-15', 1, 4),
      (7, '2024-03-27', 2, 3),
      (8, '2024-03-29', 6, 3),
      (9, '2024-03-31', 5, 2),
      (10, '2024-04-01', 2, 2),
      (11, '2024-04-01', 1, 3),
      (12, '2024-04-02', 7, 1);
  starter: |
    -- add the running column with a window function
    WITH daily AS (
      SELECT o.order_date, SUM(m.price * o.quantity) AS revenue
      FROM orders o
      JOIN menu m ON m.id = o.menu_id
      GROUP BY o.order_date
    )
    SELECT order_date, revenue
    FROM daily
    ORDER BY order_date;
  hints:
    - "A running total is a `SUM` with an `OVER`. The rows are not summed up into one: every date is still shown and gets the total up to that date."
    - "Inside `OVER`, write the order used for adding up: `OVER (ORDER BY order_date)`."
    - "The third column: `SUM(revenue) OVER (ORDER BY order_date) AS running`."
  tests:
    - output: |
        order_date|revenue|running
        2024-02-26|48000|48000
        2024-02-28|36000|84000
        2024-03-01|65000|149000
        2024-03-15|40000|189000
        2024-03-27|45000|234000
        2024-03-29|36000|270000
        2024-03-31|36000|306000
        2024-04-01|60000|366000
        2024-04-02|25000|391000
    - input: |
        INSERT INTO orders VALUES
          (13, '2024-03-10', 5, 1),
          (14, '2024-04-03', 3, 2);
      output: |
        order_date|revenue|running
        2024-02-26|48000|48000
        2024-02-28|36000|84000
        2024-03-01|65000|149000
        2024-03-10|18000|167000
        2024-03-15|40000|207000
        2024-03-27|45000|252000
        2024-03-29|36000|288000
        2024-03-31|36000|324000
        2024-04-01|60000|384000
        2024-04-02|25000|409000
        2024-04-03|24000|433000
  solution: |
    WITH daily AS (
      SELECT o.order_date, SUM(m.price * o.quantity) AS revenue
      FROM orders o
      JOIN menu m ON m.id = o.menu_id
      GROUP BY o.order_date
    )
    SELECT order_date, revenue, SUM(revenue) OVER (ORDER BY order_date) AS running
    FROM daily
    ORDER BY order_date;

- slug: the-best-seller-report
  type: code
  title: The best-seller report
  prompt: |
    Time to build the final report for Ms. Rina, with everything you have learned. Show **every** menu item, including the ones nobody has ordered, with four columns:

    - `position`: the rank by highest `revenue`, using `RANK()`
    - `name`: the item name
    - `sold`: the sum of all servings ordered, `0` when never ordered
    - `revenue`: the sum of price times quantity, `0` when never ordered

    Sort by `position`. When equal, sort by `name` in alphabetical order.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, name TEXT, category TEXT, price INTEGER);
    INSERT INTO menu VALUES
      (1, 'Black Coffee', 'drink', 10000),
      (2, 'Milk Coffee', 'drink', 15000),
      (3, 'Pulled Tea', 'drink', 12000),
      (4, 'Sweet Iced Tea', 'drink', 8000),
      (5, 'Toast', 'food', 18000),
      (6, 'Banana Fritters', 'food', 12000),
      (7, 'Fried Rice', 'food', 25000);
    CREATE TABLE orders (id INTEGER PRIMARY KEY, order_date TEXT, menu_id INTEGER, quantity INTEGER);
    INSERT INTO orders VALUES
      (1, '2024-02-26', 2, 2),
      (2, '2024-02-26', 5, 1),
      (3, '2024-02-28', 3, 3),
      (4, '2024-03-01', 2, 1),
      (5, '2024-03-01', 7, 2),
      (6, '2024-03-15', 1, 4),
      (7, '2024-03-27', 2, 3),
      (8, '2024-03-29', 6, 3),
      (9, '2024-03-31', 5, 2),
      (10, '2024-04-01', 2, 2),
      (11, '2024-04-01', 1, 3),
      (12, '2024-04-02', 7, 1);
  starter: |
    -- complete it: every item must be shown (0 when never ordered), then add the rank
    WITH per_item AS (
      SELECT m.name, SUM(o.quantity) AS sold, SUM(m.price * o.quantity) AS revenue
      FROM menu m
      JOIN orders o ON o.menu_id = m.id
      GROUP BY m.id, m.name
    )
    SELECT name, sold, revenue
    FROM per_item
    ORDER BY revenue DESC, name;
  hints:
    - "Work in steps. First fix the CTE so that items without orders are shown too, with 0, as in lesson 1. Only then add the rank in the main statement."
    - "In the CTE: change `JOIN` into `LEFT JOIN`, then wrap both `SUM`s in `COALESCE(..., 0)`. The rank is `RANK() OVER (ORDER BY revenue DESC)`."
    - "The main statement: `SELECT RANK() OVER (ORDER BY revenue DESC) AS position, name, sold, revenue FROM per_item ORDER BY position, name;`"
  tests:
    - output: |
        position|name|sold|revenue
        1|Milk Coffee|8|120000
        2|Fried Rice|3|75000
        3|Black Coffee|7|70000
        4|Toast|3|54000
        5|Banana Fritters|3|36000
        5|Pulled Tea|3|36000
        7|Sweet Iced Tea|0|0
    - input: |
        INSERT INTO menu VALUES (8, 'Orange Juice', 'drink', 14000);
        INSERT INTO orders VALUES
          (13, '2024-04-03', 4, 5),
          (14, '2024-04-03', 7, 2),
          (15, '2024-04-03', 5, 1);
      output: |
        position|name|sold|revenue
        1|Fried Rice|5|125000
        2|Milk Coffee|8|120000
        3|Toast|4|72000
        4|Black Coffee|7|70000
        5|Sweet Iced Tea|5|40000
        6|Banana Fritters|3|36000
        6|Pulled Tea|3|36000
        8|Orange Juice|0|0
  solution: |
    WITH per_item AS (
      SELECT m.name,
             COALESCE(SUM(o.quantity), 0) AS sold,
             COALESCE(SUM(m.price * o.quantity), 0) AS revenue
      FROM menu m
      LEFT JOIN orders o ON o.menu_id = m.id
      GROUP BY m.id, m.name
    )
    SELECT RANK() OVER (ORDER BY revenue DESC) AS position, name, sold, revenue
    FROM per_item
    ORDER BY position, name;

- slug: equal-ranks
  type: choice
  title: Equal ranks
  prompt: |
    Four items have a revenue of 90000, 50000, 50000 and 40000. Which ranks does `RANK() OVER (ORDER BY revenue DESC)` give them, in that order?
  options:
    - "1, 2, 3, 4"
    - "1, 2, 2, 3"
    - "1, 2, 2, 4"
    - "1, 3, 3, 4"
  correct: [2]
  hint: "Equal values get the same rank. Then: how many items have a higher revenue than the last one?"
  explanation: "The two items with a revenue of 50000 both get rank 2. The last item gets rank 4, not 3, because three items are above it: `RANK` skips the numbers used up by the tied values. That is why Sweet Iced Tea is ranked 7 in your report, after two items at rank 5."
