summary: >-
  Dapur Bu Sari menerima pesanan nasi kotak dari aplikasi pesan-antar dalam
  bentuk JSON. Di kursus ini kamu belajar membaca JSON dengan Python, menelusuri
  data bersarang, menyaring dan menjumlahkan daftar pesanan, menyusun JSON
  sendiri, menghadapi data yang kotor, sampai membuat ringkasan harian sebagai
  teks dan sebagai JSON.
perks:
  - 6 pelajaran, 12 latihan kode, dan 6 soal pilihan ganda
  - Petunjuk bertahap di setiap latihan kode, dari arahan ringan sampai hampir jawabannya
  - Semua latihan dijalankan langsung di browser
  - Sertifikat penyelesaian dari tolie.space dengan tanda tangan Christianto Lie
translations:
  en:
    title: "Python: Working with JSON Data from Apps"
    level: Intermediate
    summary: >-
      Ms. Sari's Kitchen receives its rice box orders from a food-delivery app
      as JSON. In this course you learn to read JSON with Python, walk through
      nested data, filter and total a list of orders, build JSON of your own,
      cope with dirty data, and finish with a daily summary printed as text
      and as JSON.
    perks:
      - 6 lessons, 12 coding exercises and 6 multiple-choice questions
      - Step-by-step hints on every coding exercise, from a gentle nudge to nearly the answer
      - Every exercise runs right in your browser, nothing to install
      - A completion certificate from tolie.space, signed by Christianto Lie
