- slug: daily-box-stock
  type: code
  title: Stok kardus harian
  prompt: |
    Baris pertama berisi stok kardus awal, baris kedua `n`, lalu `n` baris perubahan stok per hari (positif jika kiriman datang, negatif jika dipakai).

    Cetak stok di akhir setiap hari, lalu stok tertinggi dan terendah beserta harinya:

    ```
    Hari 1: 25
    Hari 2: 17
    Hari 3: 27
    Hari 4: 24
    Tertinggi: 27 (hari 3)
    Terendah: 17 (hari 2)
    ```

    Yang dibandingkan adalah stok di akhir hari, jadi stok awal tidak ikut. Jika ada nilai yang sama, cetak hari yang **paling awal**. Jika `n` adalah 0, cetak hanya `Tidak ada data`.
  language: python
  starter: |
    stok = int(input())
    n = int(input())

    for hari in range(1, n + 1):
        stok += int(input())
        print(f"Hari {hari}: {stok}")
        # perbarui rekor tertinggi dan terendah beserta harinya

    # cetak Tertinggi dan Terendah, atau "Tidak ada data" jika n adalah 0
  hints:
    - "Total berjalannya sudah ada. Kamu perlu empat catatan tambahan: `tertinggi`, `hari_tinggi`, `terendah`, `hari_rendah`, yang diperbarui di dalam perulangan."
    - "Rekor awal harus berasal dari hari pertama. Salah satu caranya: `if hari == 1 or stok > tertinggi:` lalu isi `tertinggi = stok` dan `hari_tinggi = hari`. Lakukan hal serupa dengan `<` untuk yang terendah."
    - "Setelah perulangan: `if n == 0:` cetak `Tidak ada data`, selain itu cetak `f\"Tertinggi: {tertinggi} (hari {hari_tinggi})\"` dan baris serupa untuk `Terendah`."
  tests:
    - input: "20\n4\n5\n-8\n10\n-3"
      output: "Hari 1: 25\nHari 2: 17\nHari 3: 27\nHari 4: 24\nTertinggi: 27 (hari 3)\nTerendah: 17 (hari 2)"
    - input: "10\n3\n-4\n-4\n-1"
      output: "Hari 1: 6\nHari 2: 2\nHari 3: 1\nTertinggi: 6 (hari 1)\nTerendah: 1 (hari 3)"
    - input: "50\n0"
      output: "Tidak ada data"
    - input: "0\n4\n5\n-5\n5\n-5"
      output: "Hari 1: 5\nHari 2: 0\nHari 3: 5\nHari 4: 0\nTertinggi: 5 (hari 1)\nTerendah: 0 (hari 2)"
    - input: "7\n1\n0"
      output: "Hari 1: 7\nTertinggi: 7 (hari 1)\nTerendah: 7 (hari 1)"
  solution: |
    stok = int(input())
    n = int(input())

    tertinggi = 0
    hari_tinggi = 0
    terendah = 0
    hari_rendah = 0
    for hari in range(1, n + 1):
        stok += int(input())
        print(f"Hari {hari}: {stok}")
        if hari == 1 or stok > tertinggi:
            tertinggi = stok
            hari_tinggi = hari
        if hari == 1 or stok < terendah:
            terendah = stok
            hari_rendah = hari

    if n == 0:
        print("Tidak ada data")
    else:
        print(f"Tertinggi: {tertinggi} (hari {hari_tinggi})")
        print(f"Terendah: {terendah} (hari {hari_rendah})")

- slug: drop-the-double-scans
  type: code
  title: Buang resi yang terpindai ganda
  prompt: |
    Alat pindai di loket kadang membaca paket yang sama lebih dari sekali.

    Baris pertama berisi `n`, lalu `n` baris nomor resi sesuai urutan pindai. Cetak setiap resi **sekali saja**, dalam urutan pertama kali terpindai. Lalu cetak jumlah resi unik dan jumlah pindaian yang dibuang:

    ```
    KJ-104
    KJ-221
    KJ-087
    Unik: 3
    Duplikat: 3
    ```

    Urutan pindai tidak boleh berubah, jadi jangan mengurutkan hasilnya.
  language: python
  starter: |
    n = int(input())
    pindai = []
    for _ in range(n):
        pindai.append(input())

    unik = []
    # masukkan ke unik hanya resi yang belum pernah terlihat
    for resi in pindai:
        unik.append(resi)

    for resi in unik:
        print(resi)
    print(f"Unik: {len(unik)}")
    print("Duplikat: 0")
  hints:
    - "Kode awal memasukkan semua resi ke `unik`. Tambahkan ingatan `sudah = set()` dan masukkan resi hanya jika belum ada di dalamnya."
    - "Di dalam perulangan: `if resi not in sudah:` lalu `sudah.add(resi)` dan `unik.append(resi)`. Urutannya terjaga karena `unik` adalah list yang diisi sesuai urutan pindai."
    - "Jumlah duplikat tidak perlu dihitung satu per satu: itu selisih antara semua pindaian dan yang unik, `n - len(unik)`."
  tests:
    - input: "6\nKJ-104\nKJ-221\nKJ-104\nKJ-087\nKJ-221\nKJ-104"
      output: "KJ-104\nKJ-221\nKJ-087\nUnik: 3\nDuplikat: 3"
    - input: "3\nKJ-300\nKJ-100\nKJ-200"
      output: "KJ-300\nKJ-100\nKJ-200\nUnik: 3\nDuplikat: 0"
    - input: "0"
      output: "Unik: 0\nDuplikat: 0"
    - input: "4\nKJ-555\nKJ-555\nKJ-555\nKJ-555"
      output: "KJ-555\nUnik: 1\nDuplikat: 3"
  solution: |
    n = int(input())
    pindai = []
    for _ in range(n):
        pindai.append(input())

    sudah = set()
    unik = []
    for resi in pindai:
        if resi not in sudah:
            sudah.add(resi)
            unik.append(resi)

    for resi in unik:
        print(resi)
    print(f"Unik: {len(unik)}")
    print(f"Duplikat: {n - len(unik)}")

- slug: the-starting-record
  type: choice
  title: Nilai awal rekor
  prompt: |
    Selisih kas loket selama tiga hari semuanya minus. Apa yang dicetak kode ini?

    ```python
    selisih = [-3000, -7000, -2000]

    tertinggi = 0
    for s in selisih:
        if s > tertinggi:
            tertinggi = s
    print(tertinggi)
    ```
  options:
    - "`-2000`"
    - "`-7000`"
    - "`0`"
    - "`-3000`"
  correct: [2]
  hint: Adakah data yang lebih besar daripada nilai awal `tertinggi`?
  explanation: "Tidak ada data yang lebih besar dari 0, jadi `tertinggi` tidak pernah diganti dan yang tercetak adalah `0`, angka yang bahkan tidak ada di datanya. Jawaban yang benar, `-2000`, baru didapat kalau rekor awal diambil dari data pertama: `tertinggi = selisih[0]`."
