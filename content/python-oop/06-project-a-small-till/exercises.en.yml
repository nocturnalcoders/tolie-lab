      output: "pulled tea: Rp12000\nNot on the menu: fried rice"
    - input: "2\nmilk coffee,15000\norange juice,10000\n3\n Milk Coffee \nORANGE JUICE\ncoffee"
      output: "milk coffee: Rp15000\norange juice: Rp10000\nNot on the menu: coffee"
