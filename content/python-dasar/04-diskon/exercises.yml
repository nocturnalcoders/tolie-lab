- slug: hitung-diskon
  type: code
  title: Hitung diskon
  prompt: |
    Baca total belanja. Jika totalnya **100000 atau lebih**, pelanggan dapat diskon 10%. Cetak jumlah yang harus dibayar dengan format `Bayar: Rp<jumlah>`.
  language: python
  starter: |
    total = int(input())
    # cetak "Bayar: Rp..." setelah memeriksa diskon
  hint: Bayar 90% dari total dengan total * 90 // 100.
  tests:
    - input: "50000"
      output: "Bayar: Rp50000"
    - input: "100000"
      output: "Bayar: Rp90000"
    - input: "250000"
      output: "Bayar: Rp225000"
  solution: |
    total = int(input())
    if total >= 100000:
        bayar = total * 90 // 100
    else:
        bayar = total
    print(f"Bayar: Rp{bayar}")

- slug: kategori-pesanan
  type: code
  title: Kategori pesanan
  prompt: |
    Baca jumlah item dalam satu pesanan. Cetak `Pesanan besar` jika 10 item atau lebih, `Pesanan sedang` jika 3 sampai 9 item, dan `Pesanan kecil` jika kurang dari 3.
  language: python
  starter: |
    jumlah = int(input())
    # pilih salah satu dari tiga kategori
  tests:
    - input: "12"
      output: "Pesanan besar"
    - input: "10"
      output: "Pesanan besar"
    - input: "5"
      output: "Pesanan sedang"
    - input: "3"
      output: "Pesanan sedang"
    - input: "2"
      output: "Pesanan kecil"
  solution: |
    jumlah = int(input())
    if jumlah >= 10:
        print("Pesanan besar")
    elif jumlah >= 3:
        print("Pesanan sedang")
    else:
        print("Pesanan kecil")

- slug: kuis-kondisi
  type: choice
  title: Kondisi yang benar
  prompt: Jika `x = 10`, kondisi mana yang bernilai `True`?
  options:
    - "`x > 10`"
    - "`x == 10`"
    - "`x != 10`"
    - "`x < 5`"
  correct: [1]
  explanation: "`x == 10` benar karena `x` memang bernilai 10. `x > 10` salah karena 10 tidak lebih besar dari 10."
