- slug: what-does-it-print
  type: choice
  title: Apa yang tercetak?
  prompt: |
    Dua baris apa yang dicetak program ini, berurutan?

    ```java
    class Buku {
        String judul;
        int harga;
        int stok;

        Buku(String judul, int harga, int stok) {
            this.judul = judul;
            this.harga = harga;
            this.stok = stok;
        }

        void jual(int jumlah) {
            stok -= jumlah;
        }

        int nilaiStok() {
            return harga * stok;
        }
    }

    public class Gudang {
        public static void main(String[] args) {
            Buku kamus = new Buku("Kamus Saku", 50000, 10);
            Buku atlas = new Buku("Atlas Dunia", 120000, 4);
            Buku pilihan = kamus;

            pilihan.jual(3);
            atlas.jual(1);

            System.out.println(kamus.stok + " " + atlas.stok);
            System.out.println(kamus.nilaiStok());
        }
    }
    ```
  options:
    - "`10 3`, lalu `500000`"
    - "`7 3`, lalu `350000`"
    - "`7 3`, lalu `500000`"
    - "`6 6`, lalu `300000`"
  correct: [1]
  hint: Hitung berapa kali `new Buku(...)` dijalankan. Sebanyak itulah jumlah objeknya. Lalu, `pilihan` menunjuk objek yang mana?
  explanation: >-
    Hanya ada dua objek, karena `new` dipanggil dua kali. `Buku pilihan = kamus;` tidak menyalin
    buku: `pilihan` dan `kamus` menunjuk objek yang sama, sehingga `pilihan.jual(3)` menurunkan stok
    kamus dari 10 menjadi 7. `atlas` adalah objek lain dengan stok sendiri, 4 menjadi 3. Baris pertama
    mencetak `7 3`, dan `nilaiStok()` menghitung dengan stok yang sekarang: 50000 x 7 = `350000`.
    Jawaban `10 3` menganggap `pilihan` adalah salinan, dan `6 6` menganggap semua buku berbagi satu
    `stok`; keduanya keliru.

- slug: which-line-does-the-compiler-reject
  type: choice
  title: Baris mana yang ditolak compiler?
  prompt: |
    Class `Buku` sama seperti di soal sebelumnya: satu-satunya constructor-nya adalah
    `Buku(String judul, int harga, int stok)`. Baris mana yang membuat `javac` menolak program ini?

    ```java
    public class Gudang {
        public static void main(String[] args) {
            Buku kamus = new Buku("Kamus Saku", 50000, 10);   // baris 3
            Buku atlas = new Buku();                          // baris 4
            kamus.jual(2);                                    // baris 5
            System.out.println(kamus.judul);                  // baris 6
        }
    }
    ```
  options:
    - "Baris 3, karena kata `new` tidak diperlukan; cukup `Buku(...)` seperti di Python"
    - "Baris 5, karena hasil `jual` harus disimpan ke variabel"
    - "Baris 4, karena constructor `Buku` meminta tiga nilai dan di sini tidak diberi satu pun"
    - "Baris 6, karena field hanya boleh dibaca dari dalam class-nya sendiri"
  correct: [2]
  hint: Bandingkan isi kurung pada tiap `new Buku(...)` dengan daftar parameter constructor.
  explanation: >-
    Class `Buku` hanya punya constructor dengan tiga parameter, jadi `new Buku()` tanpa nilai tidak
    cocok dengan constructor mana pun dan ditolak compiler. Baris 3 benar: di Java objek memang dibuat
    dengan `new`. Baris 5 benar: `jual` bertipe `void`, jadi tidak ada hasil yang perlu, atau bisa,
    disimpan. Baris 6 juga lolos, karena field `judul` tidak ditandai `private`, sehingga bisa dibaca
    dari class lain di folder yang sama.

- slug: which-line-fills-the-blank
  type: choice
  title: Baris mana yang mengisi bagian kosong?
  prompt: |
    Program ini harus mencetak `Kamus Saku: Rp50000`. Baris mana yang benar untuk `_____`?

    ```java
    class Buku {
        String judul;
        int harga;

        Buku(String judul, int harga) {
            this.judul = judul;
            _____
        }
    }

    public class Label {
        public static void main(String[] args) {
            Buku kamus = new Buku("Kamus Saku", 50000);
            System.out.println(kamus.judul + ": Rp" + kamus.harga);
        }
    }
    ```
  options:
    - "`harga = harga;`"
    - "`self.harga = harga;`"
    - "`int harga = harga;`"
    - "`this.harga = harga;`"
  correct: [3]
  hint: Di dalam constructor ada dua `harga`, yaitu parameter dan field. Bagaimana cara menyebut yang field?
  explanation: >-
    `this.harga = harga;` menyalin nilai parameter ke field milik objek yang sedang dibuat.
    `harga = harga;` adalah jebakannya: baris itu lolos kompilasi, tetapi kedua `harga` di situ adalah
    parameter, jadi field tidak pernah diisi dan program mencetak `Kamus Saku: Rp0`. `self` adalah
    kata Python; Java memakai `this`. `int harga = harga;` ditolak compiler karena mencoba membuat
    variabel baru bernama `harga`, padahal parameter dengan nama itu sudah ada.

- slug: classes-and-objects
  type: choice
  multiple: true
  title: Class dan objek
  prompt: |
    Pernyataan mana saja yang **benar** tentang class `Buku`? (Bisa lebih dari satu.)
  options:
    - "Constructor harus ditulis dengan tipe balik `void`"
    - "Class adalah cetakan; setiap `new Buku(...)` membuat satu objek baru dengan `judul`, `harga`, dan `stok` miliknya sendiri"
    - "`Buku pilihan = kamus;` membuat salinan objek, sehingga sekarang ada dua buku"
    - "Di dalam method `jual`, `stok` berarti field `stok` milik objek yang method-nya sedang dipanggil"
  correct: [1, 3]
  hint: "Dua pernyataan di sini salah. Ingat lagi: bagaimana bentuk kepala constructor, dan apa yang disimpan variabel bertipe `Buku`?"
  explanation: >-
    Class menjelaskan bentuk datanya, dan setiap `new` membuat objek baru dengan field sendiri. Saat
    `kamus.jual(2)` dipanggil, `stok` di dalam `jual` adalah `stok` milik `kamus` (boleh juga ditulis
    `this.stok`). Constructor tidak punya tipe balik sama sekali; kalau ditulis `void Buku(...)`, Java
    menganggapnya method biasa, bukan constructor. Dan `Buku pilihan = kamus;` hanya menyalin
    rujukannya: tetap ada satu objek, sekarang dengan dua nama.

- slug: practice-book-class
  type: code
  required: false
  title: "Latihan: class Book"
  prompt: |
    Lengkapi class `Book`: constructor-nya harus menyimpan `title`, `price`, dan `stock` ke field, dan method `value()` mengembalikan nilai stok buku itu (`price` × `stock`). `main` sudah membuat objeknya dan mencetak `<title>: Rp<value>`.

    Latihan ini opsional. Kodemu dijalankan di server, dan jatah hariannya terbatas.
  starter: |
    import java.util.Scanner;

    class Book {
        String title;
        int price;
        int stock;

        Book(String title, int price, int stock) {
            // store the three values in the fields
        }

        int value() {
            return 0;
        }
    }

    public class Main {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            Book book = new Book(in.nextLine(), in.nextInt(), in.nextInt());
            System.out.println(book.title + ": Rp" + book.value());
        }
    }
  hints:
    - "Di constructor, nama parameter sama dengan nama field. Pakai `this.` untuk menunjuk field."
    - "`this.title = title; this.price = price; this.stock = stock;` dan di `value()`: `return price * stock;`."
  tests:
    - input: |
        Laskar Pelangi
        85000
        4
      output: |
        Laskar Pelangi: Rp340000
    - input: |
        Bumi
        99000
        0
      output: |
        Bumi: Rp0
    - input: |
        Kamus Saku
        45000
        12
      output: |
        Kamus Saku: Rp540000
  solution: |
    import java.util.Scanner;

    class Book {
        String title;
        int price;
        int stock;

        Book(String title, int price, int stock) {
            this.title = title;
            this.price = price;
            this.stock = stock;
        }

        int value() {
            return price * stock;
        }
    }

    public class Main {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            Book book = new Book(in.nextLine(), in.nextInt(), in.nextInt());
            System.out.println(book.title + ": Rp" + book.value());
        }
    }
