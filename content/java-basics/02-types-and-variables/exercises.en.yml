- slug: what-does-it-print
  type: choice
  title: What does it print?
  prompt: |
    Mr. Bayu has 17 new books and each shelf holds 5. Which three lines does this program print, in order?

    ```java
    public class Shelf {
        public static void main(String[] args) {
            int books = 17;
            int perShelf = 5;
            System.out.println(books / perShelf);
            System.out.println(books / 5.0);
            System.out.println("Shelves: " + books / perShelf + 1);
        }
    }
    ```
  options:
    - "`3.4`, `3.4`, `Shelves: 4.4`"
    - "`3`, `3.4`, `Shelves: 4`"
    - "`3`, `3.4`, `Shelves: 31`"
    - "`3`, `3`, `Shelves: 31`"
  correct: [2]
  hint: "For each line ask two things: are both sides of `/` an `int`? And on the last line, what does the leftmost `+` meet?"
  explanation: >-
    `books / perShelf` is an `int` divided by an `int`, so the fraction is dropped: `3`. `books / 5.0`
    involves a `double`, giving `3.4`. On the last line the division happens first (`3`), then `+`
    from the left: `"Shelves: " + 3` becomes the text `Shelves: 3`, and `+ 1` joins again to give
    `Shelves: 31`. `Shelves: 4` is tempting because we want to compute `3 + 1`, but once the left side
    is a `String`, `+` joins instead of adding. To add, you need brackets:
    `"Shelves: " + (books / perShelf + 1)`.

- slug: which-line-does-the-compiler-reject
  type: choice
  title: Which line does the compiler reject?
  prompt: |
    One line in this program makes `javac` refuse it. Which line, and why?

    ```java
    public class Price {
        public static void main(String[] args) {
            int price = 85000;                 // line 3
            double discount = 0.1;             // line 4
            int saving = price * discount;     // line 5
            boolean paid = false;              // line 6
            String cashier = "Sari";           // line 7
            System.out.println(saving);
        }
    }
    ```
  options:
    - "Line 3, because a number as large as 85000 does not fit in an `int`"
    - "Line 5, because `int * double` gives a `double`, which cannot be stored straight into an `int`"
    - "Line 6, because a boolean value must be written `False`"
    - "Line 7, because the text type is written `string` in lowercase"
  correct: [1]
  hint: Look for the line where the type on the left of `=` does not match the type of the calculation on the right.
  explanation: >-
    `price * discount` is an `int` times a `double`, which gives a `double` (8500.0). Java will not
    silently throw the fraction away, so storing it in an `int` is rejected with `possible lossy
    conversion from double to int`. The fix is `double saving = price * discount;` or
    `(int) (price * discount)`. The other lines are fine: an `int` holds up to about 2 billion, Java
    booleans are written `false` in lowercase (`False` is the Python spelling), and `String` really
    does start with a capital S.

- slug: which-line-fills-the-blank
  type: choice
  title: Which line fills the blank?
  prompt: |
    In 2 days, 7 books were sold. This program must print the average per day, which is `3.5`.
    Which line correctly fills `_____`?

    ```java
    public class Average {
        public static void main(String[] args) {
            int sold = 7;
            int days = 2;
            _____
            System.out.println(average);
        }
    }
    ```
  options:
    - "`double average = (double) sold / days;`"
    - "`double average = sold / days;`"
    - "`int average = sold / days;`"
    - "`double average = (double) (sold / days);`"
  correct: [0]
  hint: The division itself must already involve a `double`. Changing the type after the division is done is too late.
  explanation: >-
    `(double) sold / days` turns `sold` into `7.0` **before** dividing, so the result is `3.5`.
    `double average = sold / days;` is the most tempting option, but the division is still an `int`
    by an `int` (giving `3`), which is only then stored as `3.0`. `(double) (sold / days)` is no
    better: the brackets make the integer division finish first, and then `3` becomes `3.0`. With
    `int average` the program prints `3`.

- slug: javas-type-rules
  type: choice
  multiple: true
  title: Java's type rules
  prompt: |
    Which statements about types and operators in Java are **true**? (There may be more than one.)
  options:
    - 'After `int stock = 12;`, the line `stock = "twelve";` is rejected by the compiler'
    - "`double price = 85000;` is accepted: a whole number may be stored in a `double`"
    - "`17 % 5` gives `3`"
    - '`"Stock: " + 4 + 1` gives the text `Stock: 41`'
  correct: [0, 1, 3]
  hint: "`%` is not division. Work out 17 divided by 5: what is the result, and what is left over?"
  explanation: >-
    A variable's type cannot change, so an `int stock` cannot be given text. A whole number may go
    into a `double` because nothing is lost (it is stored as `85000.0`). `+` works from left to right
    and joins as soon as it meets a `String`, so the result is `Stock: 41`. The false one is `17 % 5`:
    `%` gives the **remainder**, which is `2`. The number `3` is the result of `17 / 5`, and the two
    operators are easy to mix up.

- slug: practice-discounted-total
  type: code
  required: false
  title: "Practice: total after a discount"
  prompt: |
    The program reads a price, a quantity and a discount percentage (all `int`). Print `Rp<total>`, where total = price × quantity, minus the discount. Use whole-number arithmetic: multiply by `(100 - discount)` first, then divide by 100.

    This exercise is optional. Your code runs on the server, and the daily allowance is small.
  starter: |
    import java.util.Scanner;

    public class Main {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int price = in.nextInt();
            int quantity = in.nextInt();
            int discount = in.nextInt();
            int total = price * quantity;
            // apply the discount, then print Rp<total>
            System.out.println("Rp" + total);
        }
    }
  hints:
    - "The starter is already right when the discount is 0. Only one line of arithmetic is missing."
    - "`total = total * (100 - discount) / 100;` The order matters: dividing first would drop the fraction, because `int` division does."
  tests:
    - input: |
        85000
        2
        10
      output: |
        Rp153000
    - input: |
        99000
        1
        0
      output: |
        Rp99000
    - input: |
        12500
        3
        25
      output: |
        Rp28125
    - input: |
        50000
        4
        100
      output: |
        Rp0
  solution: |
    import java.util.Scanner;

    public class Main {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int price = in.nextInt();
            int quantity = in.nextInt();
            int discount = in.nextInt();
            int total = price * quantity;
            total = total * (100 - discount) / 100;
            System.out.println("Rp" + total);
        }
    }
