- slug: a-one-line-function
  type: choice
  title: A one-line function
  prompt: |
    Dimas wrote this function:

    ```kotlin
    fun orderTotal(weight: Int, rate: Int = 7000) = weight * rate
    ```

    Choose **all** the statements that are true.
  multiple: true
  options:
    - "`orderTotal(3)` gives `21000`, because `rate` uses its default value"
    - "`orderTotal(3, 12000)` gives `36000`"
    - "`rate` is always `7000` and cannot be changed when the function is called"
    - "The return type is `Int`, inferred by Kotlin from `weight * rate`"
    - "This function is invalid, because it has no `{ }` and no `return`"
  correct: [0, 1, 3]
  hint: A default value is only used when the caller does not pass that parameter.
  explanation: >-
    `rate: Int = 7000` is a default value: `orderTotal(3)` uses 7000 and gives 21000, while
    `orderTotal(3, 12000)` uses 12000 and gives 36000. So `rate` can be changed. A function with
    a single expression may be written with `=`, without `{ }` and `return`, and its return type
    is inferred: an `Int` times an `Int` is an `Int`.

- slug: what-does-it-print
  type: choice
  title: What does it print?
  prompt: |
    What does this program print?

    ```kotlin
    fun main() {
        val weights = listOf(2, 6, 3, 8)
        val large = weights.filter { it >= 5 }
        val total = large.sumOf { it * 7000 }
        println("$large $total")
    }
    ```
  options:
    - "`[2, 6, 3, 8] 133000`"
    - "`[6, 8] 14`"
    - "`[6, 8] 98000`"
    - "`[2, 3] 35000`"
  correct: [2]
  hint: Work out what `large` holds first, then compute `it * 7000` for each item and add them up.
  explanation: >-
    `filter { it >= 5 }` keeps the elements that are 5 or more, so `large` holds `[6, 8]`.
    `sumOf { it * 7000 }` adds 42000 + 56000 = 98000. The answer `[2, 3] 35000` reverses the
    meaning of `filter` (it keeps what matches, it does not throw it away), and
    `[2, 6, 3, 8] 133000` adds up `weights`, although the sum is over `large`.

- slug: which-line-is-rejected
  type: choice
  title: Which line is rejected?
  prompt: |
    One line stops this program from compiling. Which line, and why?

    ```kotlin
    fun main() {
        val services = listOf("wash", "iron")      // line 1
        val queue = mutableListOf("Mrs. Wati")     // line 2
        queue.add("Mr. Joko")                      // line 3
        services.add("fold")                       // line 4
        println(queue.size)                        // line 5
    }
    ```
  options:
    - "Line 3: `queue` is a `val`, so nothing can be added to it"
    - "Line 4: a list from `listOf` is read-only and has no `add`"
    - "Line 2: a `mutableListOf` must be stored in a `var`"
    - "Line 5: `size` must be written `size()`"
  correct: [1]
  hint: What decides whether you can add items is how the list was made, not `val` or `var`.
  explanation: >-
    `listOf` makes a read-only list, so `services.add(...)` does not exist and line 4 is
    rejected. Line 3 is valid: `val` only locks the variable `queue` so it cannot be pointed at
    another list, while the contents of a `mutableListOf` may still change. `size` is a
    property, so it is written without parentheses.

- slug: fill-in-the-blank
  type: choice
  title: Fill in the blank
  prompt: |
    This program must print `[14000, 35000]`. What goes in place of `____`?

    ```kotlin
    fun main() {
        val weights = listOf(2, 5)
        val prices = ____
        println(prices)
    }
    ```
  options:
    - "`weights.map { it * 7000 }`"
    - "`weights.filter { it * 7000 }`"
    - "`weights.sumOf { it * 7000 }`"
    - "`weights * 7000`"
  correct: [0]
  hint: The result is a list with the same number of elements, but each element has been transformed.
  explanation: >-
    `map` transforms each element and gives a new list: 2 becomes 14000 and 5 becomes 35000.
    `sumOf` adds everything up into one number, `49000`. `filter` needs a lambda that is `true`
    or `false`, not a number, so it is rejected. `weights * 7000` is rejected too: a list cannot
    be multiplied by a number.

- slug: practice-big-orders
  type: code
  required: false
  title: "Practice: the sum of the big orders"
  prompt: |
    The program reads `n`, then `n` order amounts into `orders` (a `List<Int>`). Print `Rp<sum>` of only the orders worth `20000` or more. Use `filter` and `sum`.

    This exercise is optional. Your code runs on the server, and the daily allowance is small.
  starter: |
    fun main() {
        val n = readln().toInt()
        val orders = List(n) { readln().toInt() }
        // keep the orders of 20000 or more, then add them up
        val total = orders.sum()
        println("Rp$total")
    }
  hints:
    - "`filter { ... }` gives a new list with the elements that meet the condition. Inside the braces the element is called `it`."
    - "`val total = orders.filter { it >= 20000 }.sum()`"
  tests:
    - input: |
        3
        21000
        14000
        30000
      output: |
        Rp51000
    - input: |
        2
        20000
        19999
      output: |
        Rp20000
    - input: |
        0
      output: |
        Rp0
    - input: |
        3
        5000
        7000
        12000
      output: |
        Rp0
  solution: |
    fun main() {
        val n = readln().toInt()
        val orders = List(n) { readln().toInt() }
        val total = orders.filter { it >= 20000 }.sum()
        println("Rp$total")
    }
