- slug: urai-transaksi
  type: code
  title: Urai transaksi
  prompt: |
    Tulis fungsi `urai(baris)` untuk baris berformat `pelanggan,menu,jumlah`.

    Untuk baris yang sah, kembalikan dictionary dengan kunci `pelanggan` (dirapikan dengan `.strip().title()`), `menu` (dirapikan dengan `.strip().lower()`), dan `jumlah` (angka). Kembalikan `None` jika baris rusak: kolomnya bukan tiga, jumlahnya bukan angka, jumlahnya 0 atau kurang, atau menunya tidak ada di `HARGA`.

    Program di bawahnya sudah mencetak setiap transaksi sah dan menghitung baris sah serta rusak.
  language: python
  starter: |
    HARGA = {"kopi susu": 15000, "teh tarik": 12000, "roti bakar": 18000, "es jeruk": 10000}


    def urai(baris):
        # kembalikan dictionary untuk baris sah, None untuk baris rusak
        pass


    n = int(input())
    sah = 0
    rusak = 0
    for _ in range(n):
        t = urai(input())
        if t is None:
            rusak += 1
        else:
            sah += 1
            print(f"{t['pelanggan']} | {t['menu']} | {t['jumlah']}")
    print(f"Baris sah: {sah}")
    print(f"Baris rusak: {rusak}")
  hints:
    - "Kerjakan dua lapis pemeriksaan. Pertama, hal yang bisa menimbulkan error (memecah menjadi tiga kolom dan `int`), di dalam try/except. Kedua, hal yang diperiksa dengan `if` (jumlah dan menu)."
    - "Di dalam `try`: `pelanggan, menu, jumlah = baris.split(\",\")` lalu `jumlah = int(jumlah)`. Di `except ValueError:` tulis `return None`."
    - "Setelah try/except: `menu = menu.strip().lower()`. Jika `jumlah <= 0 or menu not in HARGA`, `return None`. Selain itu kembalikan `{\"pelanggan\": pelanggan.strip().title(), \"menu\": menu, \"jumlah\": jumlah}`."
  tests:
    - input: "4\nsiti,kopi susu,2\nBudi, Roti Bakar ,1\nagus,teh tarik,dua\n dewi ,es jeruk,3"
      output: "Siti | kopi susu | 2\nBudi | roti bakar | 1\nDewi | es jeruk | 3\nBaris sah: 3\nBaris rusak: 1"
    - input: "3\nsiti,nasi goreng,1\nbudi,kopi susu,0\nrina,KOPI SUSU,4"
      output: "Rina | kopi susu | 4\nBaris sah: 1\nBaris rusak: 2"
    - input: "3\nbudi,teh tarik\nbudi santoso,teh tarik,1\nagus,es jeruk,-2"
      output: "Budi Santoso | teh tarik | 1\nBaris sah: 1\nBaris rusak: 2"
    - input: "2\n???\nsiti,kopi susu,1,15000"
      output: "Baris sah: 0\nBaris rusak: 2"
  solution: |
    HARGA = {"kopi susu": 15000, "teh tarik": 12000, "roti bakar": 18000, "es jeruk": 10000}


    def urai(baris):
        try:
            pelanggan, menu, jumlah = baris.split(",")
            jumlah = int(jumlah)
        except ValueError:
            return None
        menu = menu.strip().lower()
        if jumlah <= 0 or menu not in HARGA:
            return None
        return {"pelanggan": pelanggan.strip().title(), "menu": menu, "jumlah": jumlah}


    n = int(input())
    sah = 0
    rusak = 0
    for _ in range(n):
        t = urai(input())
        if t is None:
            rusak += 1
        else:
            sah += 1
            print(f"{t['pelanggan']} | {t['menu']} | {t['jumlah']}")
    print(f"Baris sah: {sah}")
    print(f"Baris rusak: {rusak}")

- slug: omzet-per-menu
  type: code
  title: Omzet per menu
  prompt: |
    Fungsi `urai` dan `rupiah` sudah tersedia, dan kode awal sudah mengumpulkan transaksi sah ke dalam list `transaksi`.

    Hitung omzet setiap menu (jumlah dikali harga dari `HARGA`, dijumlahkan untuk menu yang sama). Cetak satu baris `<menu>: <omzet dalam format rupiah>` untuk setiap menu yang terjual, dari omzet **terbesar**. Jika ada omzet yang sama, urutkan menurut abjad. Baris terakhir: `Omzet: <jumlah semuanya dalam format rupiah>`.

    Jika tidak ada transaksi sah, cukup cetak `Omzet: Rp0`.
  language: python
  starter: |
    HARGA = {"kopi susu": 15000, "teh tarik": 12000, "roti bakar": 18000, "es jeruk": 10000}


    def rupiah(angka):
        return "Rp" + f"{angka:,}".replace(",", ".")


    def urai(baris):
        try:
            pelanggan, menu, jumlah = baris.split(",")
            jumlah = int(jumlah)
        except ValueError:
            return None
        menu = menu.strip().lower()
        if jumlah <= 0 or menu not in HARGA:
            return None
        return {"pelanggan": pelanggan.strip().title(), "menu": menu, "jumlah": jumlah}


    n = int(input())
    transaksi = []
    for _ in range(n):
        t = urai(input())
        if t is not None:
            transaksi.append(t)

    # hitung omzet per menu, cetak dari yang terbesar, lalu cetak totalnya
  hints:
    - "Pakai pola hitungan dari pelajaran sebelumnya, tetapi yang ditambahkan bukan 1 melainkan nilai transaksinya: `omzet[menu] = omzet.get(menu, 0) + nilai`."
    - "Nilai satu transaksi adalah `t[\"jumlah\"] * HARGA[t[\"menu\"]]`. Tambahkan nilai itu ke `omzet[t[\"menu\"]]` dan juga ke variabel `total`."
    - "Untuk urutannya, buat fungsi `urutan(pasangan)` yang mengembalikan `(-nilai, nama)` seperti di materi, lalu `for nama, nilai in sorted(omzet.items(), key=urutan):` dan cetak `f\"{nama}: {rupiah(nilai)}\"`. Terakhir cetak `f\"Omzet: {rupiah(total)}\"`."
  tests:
    - input: "5\nsiti,kopi susu,2\nbudi,roti bakar,1\nsiti,kopi susu,1\nagus,teh tarik,dua\ndewi,es jeruk,3"
      output: "kopi susu: Rp45.000\nes jeruk: Rp30.000\nroti bakar: Rp18.000\nOmzet: Rp93.000"
    - input: "3\nsiti,teh tarik,5\nbudi,kopi susu,4\nrina,es jeruk,6"
      output: "es jeruk: Rp60.000\nkopi susu: Rp60.000\nteh tarik: Rp60.000\nOmzet: Rp180.000"
    - input: "1\nRina, Roti Bakar ,100"
      output: "roti bakar: Rp1.800.000\nOmzet: Rp1.800.000"
    - input: "2\nsiti,nasi goreng,1\nbudi,kopi susu,x"
      output: "Omzet: Rp0"
  solution: |
    HARGA = {"kopi susu": 15000, "teh tarik": 12000, "roti bakar": 18000, "es jeruk": 10000}


    def rupiah(angka):
        return "Rp" + f"{angka:,}".replace(",", ".")


    def urai(baris):
        try:
            pelanggan, menu, jumlah = baris.split(",")
            jumlah = int(jumlah)
        except ValueError:
            return None
        menu = menu.strip().lower()
        if jumlah <= 0 or menu not in HARGA:
            return None
        return {"pelanggan": pelanggan.strip().title(), "menu": menu, "jumlah": jumlah}


    def urutan(pasangan):
        nama, nilai = pasangan
        return (-nilai, nama)


    n = int(input())
    transaksi = []
    for _ in range(n):
        t = urai(input())
        if t is not None:
            transaksi.append(t)

    omzet = {}
    total = 0
    for t in transaksi:
        nilai = t["jumlah"] * HARGA[t["menu"]]
        omzet[t["menu"]] = omzet.get(t["menu"], 0) + nilai
        total += nilai

    for nama, nilai in sorted(omzet.items(), key=urutan):
        print(f"{nama}: {rupiah(nilai)}")
    print(f"Omzet: {rupiah(total)}")

- slug: laporan-harian
  type: code
  title: Proyek laporan harian
  prompt: |
    Baris pertama berisi `n`, lalu `n` baris mentah berformat `pelanggan,menu,jumlah`. Fungsi `urai` dan `rupiah` sudah tersedia. Cetak laporan lima baris:

    ```
    Transaksi sah: <banyaknya baris sah>
    Baris rusak: <banyaknya baris rusak>
    Omzet: <jumlah dikali harga dari semua baris sah, format rupiah>
    Pelanggan unik: <banyaknya pelanggan berbeda di baris sah>
    Terlaris: <menu dengan jumlah terjual terbanyak> (<jumlahnya>)
    ```

    Jika ada menu yang sama banyak, pilih yang lebih awal menurut abjad. Jika tidak ada transaksi sah, baris terakhir menjadi `Terlaris: -`.
  language: python
  starter: |
    HARGA = {"kopi susu": 15000, "teh tarik": 12000, "roti bakar": 18000, "es jeruk": 10000}


    def rupiah(angka):
        return "Rp" + f"{angka:,}".replace(",", ".")


    def urai(baris):
        try:
            pelanggan, menu, jumlah = baris.split(",")
            jumlah = int(jumlah)
        except ValueError:
            return None
        menu = menu.strip().lower()
        if jumlah <= 0 or menu not in HARGA:
            return None
        return {"pelanggan": pelanggan.strip().title(), "menu": menu, "jumlah": jumlah}


    n = int(input())
    sah = 0
    rusak = 0
    for _ in range(n):
        t = urai(input())
        # hitung baris sah dan rusak, lalu kumpulkan omzet,
        # pelanggan (set), dan jumlah terjual per menu (dictionary)

    # cetak lima baris laporan
  hints:
    - "Siapkan wadahnya sebelum perulangan: `omzet = 0`, `pelanggan = set()`, dan `terjual = {}`. Di dalam perulangan, baris yang `None` hanya menambah `rusak`. Baris sah mengisi semua wadah."
    - "Untuk baris sah: `sah += 1`, `omzet += t[\"jumlah\"] * HARGA[t[\"menu\"]]`, `pelanggan.add(t[\"pelanggan\"])`, dan `terjual[t[\"menu\"]] = terjual.get(t[\"menu\"], 0) + t[\"jumlah\"]`."
    - "Untuk menu terlaris, mulai dari `terlaris = \"-\"` dan `terbanyak = 0`, lalu ulang `for menu in sorted(terjual):` dan perbarui keduanya hanya jika `terjual[menu] > terbanyak`. Cetak `Terlaris: -` jika `terbanyak` masih 0, selain itu `f\"Terlaris: {terlaris} ({terbanyak})\"`."
  tests:
    - input: "5\nsiti,kopi susu,2\nbudi,roti bakar,1\n SITI ,Kopi Susu,1\nagus,teh tarik,dua\ndewi,es jeruk,2"
      output: "Transaksi sah: 4\nBaris rusak: 1\nOmzet: Rp83.000\nPelanggan unik: 3\nTerlaris: kopi susu (3)"
    - input: "4\nrina,teh tarik,3\nbudi,es jeruk,3\nrina,roti bakar,1\nbudi,kopi susu,2"
      output: "Transaksi sah: 4\nBaris rusak: 0\nOmzet: Rp114.000\nPelanggan unik: 2\nTerlaris: es jeruk (3)"
    - input: "6\nsiti,kopi susu,1\nbudi,kopi susu,1\nagus,kopi susu,1\nsiti,teh tarik,2\ndewi,roti bakar,0\nsiti,es jeruk,1"
      output: "Transaksi sah: 5\nBaris rusak: 1\nOmzet: Rp79.000\nPelanggan unik: 3\nTerlaris: kopi susu (3)"
    - input: "1\nbudi santoso,roti bakar,100"
      output: "Transaksi sah: 1\nBaris rusak: 0\nOmzet: Rp1.800.000\nPelanggan unik: 1\nTerlaris: roti bakar (100)"
    - input: "2\nsiti,nasi goreng,1\n???"
      output: "Transaksi sah: 0\nBaris rusak: 2\nOmzet: Rp0\nPelanggan unik: 0\nTerlaris: -"
  solution: |
    HARGA = {"kopi susu": 15000, "teh tarik": 12000, "roti bakar": 18000, "es jeruk": 10000}


    def rupiah(angka):
        return "Rp" + f"{angka:,}".replace(",", ".")


    def urai(baris):
        try:
            pelanggan, menu, jumlah = baris.split(",")
            jumlah = int(jumlah)
        except ValueError:
            return None
        menu = menu.strip().lower()
        if jumlah <= 0 or menu not in HARGA:
            return None
        return {"pelanggan": pelanggan.strip().title(), "menu": menu, "jumlah": jumlah}


    n = int(input())
    sah = 0
    rusak = 0
    omzet = 0
    pelanggan = set()
    terjual = {}
    for _ in range(n):
        t = urai(input())
        if t is None:
            rusak += 1
        else:
            sah += 1
            omzet += t["jumlah"] * HARGA[t["menu"]]
            pelanggan.add(t["pelanggan"])
            terjual[t["menu"]] = terjual.get(t["menu"], 0) + t["jumlah"]

    terlaris = "-"
    terbanyak = 0
    for menu in sorted(terjual):
        if terjual[menu] > terbanyak:
            terbanyak = terjual[menu]
            terlaris = menu

    print(f"Transaksi sah: {sah}")
    print(f"Baris rusak: {rusak}")
    print(f"Omzet: {rupiah(omzet)}")
    print(f"Pelanggan unik: {len(pelanggan)}")
    if terbanyak > 0:
        print(f"Terlaris: {terlaris} ({terbanyak})")
    else:
        print("Terlaris: -")

- slug: kuis-urutan-ganda
  type: choice
  title: Mengurutkan dengan dua aturan
  prompt: |
    Dalam urutan apa nama menu dicetak?

    ```python
    omzet = {"teh tarik": 60000, "roti bakar": 90000, "kopi susu": 60000}

    def urutan(pasangan):
        nama, nilai = pasangan
        return (-nilai, nama)

    for nama, nilai in sorted(omzet.items(), key=urutan):
        print(nama)
    ```
  options:
    - "`teh tarik`, `roti bakar`, `kopi susu`"
    - "`roti bakar`, `teh tarik`, `kopi susu`"
    - "`roti bakar`, `kopi susu`, `teh tarik`"
    - "`kopi susu`, `roti bakar`, `teh tarik`"
  correct: [2]
  hint: Nilai pertama di dalam kurung dibandingkan lebih dulu. Nilai kedua hanya dipakai saat yang pertama sama.
  explanation: "Tanda minus membuat omzet terbesar, `90000`, tampil paling atas, jadi `roti bakar` pertama. Dua menu lainnya sama-sama `60000`, sehingga ditentukan oleh nama menurut abjad: `kopi susu` sebelum `teh tarik`."
