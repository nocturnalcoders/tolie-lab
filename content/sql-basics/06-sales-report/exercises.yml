- slug: order-details
  type: code
  title: Order details
  prompt: |
    Build the details of every order by joining the `orders` and `menu` tables. Show four columns: the order `id`, the item `name`, `quantity`, and `subtotal` (the item price times the quantity). Sort by the order `id`.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, name TEXT, category TEXT, price INTEGER);
    INSERT INTO menu VALUES
      (1, 'Black Coffee', 'drink', 10000),
      (2, 'Milk Coffee', 'drink', 15000),
      (3, 'Pulled Tea', 'drink', 12000),
      (4, 'Sweet Iced Tea', 'drink', 8000),
      (5, 'Toast', 'food', 18000),
      (6, 'Banana Fritters', 'food', 12000),
      (7, 'Fried Rice', 'food', 25000);
    CREATE TABLE orders (id INTEGER PRIMARY KEY, order_date TEXT, menu_id INTEGER, quantity INTEGER);
    INSERT INTO orders VALUES
      (1, '2024-03-04', 2, 2),
      (2, '2024-03-04', 5, 1),
      (3, '2024-03-04', 3, 3),
      (4, '2024-03-04', 2, 1),
      (5, '2024-03-05', 7, 2),
      (6, '2024-03-05', 1, 4),
      (7, '2024-03-05', 2, 3),
      (8, '2024-03-05', 6, 2);
  starter: |
    -- join with the menu table, then add name and subtotal
    SELECT o.id, o.quantity
    FROM orders o
    ORDER BY o.id;
  hints:
    - "The name and price are in the `menu` table. The partner of each order is the menu row whose `id` equals that order's `menu_id`."
    - "Add `JOIN menu m ON m.id = o.menu_id` after `FROM orders o`. After that, `m.name` and `m.price` can be used in `SELECT`."
    - "The columns: `SELECT o.id, m.name, o.quantity, m.price * o.quantity AS subtotal`."
  tests:
    - output: |
        id|name|quantity|subtotal
        1|Milk Coffee|2|30000
        2|Toast|1|18000
        3|Pulled Tea|3|36000
        4|Milk Coffee|1|15000
        5|Fried Rice|2|50000
        6|Black Coffee|4|40000
        7|Milk Coffee|3|45000
        8|Banana Fritters|2|24000
    - input: |
        INSERT INTO menu VALUES (8, 'Orange Juice', 'drink', 14000);
        INSERT INTO orders VALUES
          (9, '2024-03-06', 4, 5),
          (10, '2024-03-06', 8, 2);
      output: |
        id|name|quantity|subtotal
        1|Milk Coffee|2|30000
        2|Toast|1|18000
        3|Pulled Tea|3|36000
        4|Milk Coffee|1|15000
        5|Fried Rice|2|50000
        6|Black Coffee|4|40000
        7|Milk Coffee|3|45000
        8|Banana Fritters|2|24000
        9|Sweet Iced Tea|5|40000
        10|Orange Juice|2|28000
  solution: |
    SELECT o.id, m.name, o.quantity, m.price * o.quantity AS subtotal
    FROM orders o
    JOIN menu m ON m.id = o.menu_id
    ORDER BY o.id;

- slug: sales-report
  type: code
  title: The sales report
  prompt: |
    Time to build the report for Ms. Rina. Join `orders` with `menu`, then show one row per menu item that has been ordered, with three columns:

    - `name`: the item name
    - `sold`: the sum of all servings ordered
    - `revenue`: the sum of price times quantity

    Sort from the highest `revenue`. When equal, sort by `name` in alphabetical order.
  setup: |
    CREATE TABLE menu (id INTEGER PRIMARY KEY, name TEXT, category TEXT, price INTEGER);
    INSERT INTO menu VALUES
      (1, 'Black Coffee', 'drink', 10000),
      (2, 'Milk Coffee', 'drink', 15000),
      (3, 'Pulled Tea', 'drink', 12000),
      (4, 'Sweet Iced Tea', 'drink', 8000),
      (5, 'Toast', 'food', 18000),
      (6, 'Banana Fritters', 'food', 12000),
      (7, 'Fried Rice', 'food', 25000);
    CREATE TABLE orders (id INTEGER PRIMARY KEY, order_date TEXT, menu_id INTEGER, quantity INTEGER);
    INSERT INTO orders VALUES
      (1, '2024-03-04', 2, 2),
      (2, '2024-03-04', 5, 1),
      (3, '2024-03-04', 3, 3),
      (4, '2024-03-04', 2, 1),
      (5, '2024-03-05', 7, 2),
      (6, '2024-03-05', 1, 4),
      (7, '2024-03-05', 2, 3),
      (8, '2024-03-05', 6, 2);
  starter: |
    -- group by item, work out sold and revenue, then sort
    SELECT m.name
    FROM orders o
    JOIN menu m ON m.id = o.menu_id;
  hints:
    - "Work in steps: the join is already there. Next, group by item name, then work out two aggregates for each group."
    - "Use `GROUP BY m.name`. Servings sold is `SUM(o.quantity)`, and revenue is `SUM(m.price * o.quantity)`."
    - "The columns are `m.name, SUM(o.quantity) AS sold, SUM(m.price * o.quantity) AS revenue`, then after the `JOIN`: `GROUP BY m.name` and `ORDER BY revenue DESC, m.name`."
  tests:
    - output: |
        name|sold|revenue
        Milk Coffee|6|90000
        Fried Rice|2|50000
        Black Coffee|4|40000
        Pulled Tea|3|36000
        Banana Fritters|2|24000
        Toast|1|18000
    - input: |
        INSERT INTO menu VALUES (8, 'Orange Juice', 'drink', 14000);
        INSERT INTO orders VALUES
          (9, '2024-03-06', 8, 3),
          (10, '2024-03-06', 5, 2),
          (11, '2024-03-06', 4, 3);
      output: |
        name|sold|revenue
        Milk Coffee|6|90000
        Toast|3|54000
        Fried Rice|2|50000
        Orange Juice|3|42000
        Black Coffee|4|40000
        Pulled Tea|3|36000
        Banana Fritters|2|24000
        Sweet Iced Tea|3|24000
  solution: |
    SELECT m.name, SUM(o.quantity) AS sold, SUM(m.price * o.quantity) AS revenue
    FROM orders o
    JOIN menu m ON m.id = o.menu_id
    GROUP BY m.name
    ORDER BY revenue DESC, m.name;

- slug: quiz-join
  type: choice
  title: An item nobody has ordered
  prompt: |
    Sweet Iced Tea is in the `menu` table, but there is not a single `orders` row for it yet. What happens to Sweet Iced Tea in the result of this statement?

    ```sql
    SELECT m.name, o.quantity
    FROM orders o
    JOIN menu m ON m.id = o.menu_id;
    ```
  options:
    - "It is shown once with a `quantity` of 0"
    - "It is shown once with a `quantity` of NULL"
    - "It is not shown at all"
    - "The statement fails with an error message"
  correct: [2]
  hint: "`JOIN` builds result rows from pairs that match according to `ON`."
  explanation: "`JOIN` only produces a row when there is a pair that meets the `ON` condition. No order has the `menu_id` of Sweet Iced Tea, so there is no pair and the item does not appear."
