- slug: sales-summary
  type: code
  title: Sales summary
  prompt: |
    The first line holds the number of days `n`, then `n` lines hold each day's sales. Print two lines:

    ```
    Total: <sum of all sales>
    Average: <total divided by n, rounded down>
    ```
  language: python
  starter: |
    n = int(input())
    total = 0
    for _ in range(n):
        # add today's sales to the total
        pass
    # print Total and Average
  hint: For division rounded down, use //.
  tests:
    - input: "3\n100000\n150000\n200000"
      output: "Total: 450000\nAverage: 150000"
    - input: "2\n50000\n75000"
      output: "Total: 125000\nAverage: 62500"
    - input: "1\n80000"
      output: "Total: 80000\nAverage: 80000"
  solution: |
    n = int(input())
    total = 0
    for _ in range(n):
        total += int(input())
    print(f"Total: {total}")
    print(f"Average: {total // n}")

- slug: best-day
  type: code
  title: Highest sales
  prompt: |
    As before: `n`, then `n` sales numbers. Print the highest sales figure in the format `Highest: <number>`.
  language: python
  starter: |
    n = int(input())
    # find the highest sales figure and print it
  hint: Keep the largest number seen so far, or collect them all in a list and use max.
  tests:
    - input: "3\n100000\n150000\n200000"
      output: "Highest: 200000"
    - input: "4\n90000\n300000\n120000\n300000"
      output: "Highest: 300000"
    - input: "1\n45000"
      output: "Highest: 45000"
  solution: |
    n = int(input())
    highest = 0
    for _ in range(n):
        value = int(input())
        if value > highest:
            highest = value
    print(f"Highest: {highest}")

- slug: quiz-range
  type: choice
  title: How many times does it repeat?
  prompt: |
    How many times does `print` run?

    ```python
    for i in range(3):
        print(i)
    ```
  options:
    - "2 times"
    - "3 times"
    - "4 times"
    - "0 times"
  correct: [1]
  explanation: "`range(3)` produces `0`, `1` and `2`, so there are three rounds."
