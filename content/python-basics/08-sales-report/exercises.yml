- slug: discount-function
  type: code
  title: Fungsi diskon
  prompt: |
    Tulis fungsi `hitung_bayar(total)` yang mengembalikan jumlah bayar setelah aturan diskon (10% untuk total 100000 atau lebih). Program di bawahnya sudah memakainya untuk mencetak `Bayar: Rp<jumlah>`.
  language: python
  starter: |
    def hitung_bayar(total):
        # kembalikan jumlah yang harus dibayar
        pass


    total = int(input())
    print(f"Bayar: Rp{hitung_bayar(total)}")
  hint: Gunakan return, bukan print, di dalam fungsi.
  tests:
    - input: "50000"
      output: "Bayar: Rp50000"
    - input: "99999"
      output: "Bayar: Rp99999"
    - input: "100000"
      output: "Bayar: Rp90000"
    - input: "250000"
      output: "Bayar: Rp225000"
  solution: |
    def hitung_bayar(total):
        if total >= 100000:
            return total * 90 // 100
        return total


    total = int(input())
    print(f"Bayar: Rp{hitung_bayar(total)}")

- slug: sales-report
  type: code
  title: Proyek laporan penjualan
  prompt: |
    Baris pertama berisi `n`, lalu `n` baris berformat `nama,jumlah,harga`. Cetak dua baris:

    ```
    Total penjualan: Rp<jumlah * harga, dijumlahkan semua baris>
    Terlaris: <nama dengan jumlah terjual terbanyak>
    ```

    Jika ada yang sama banyak, pilih yang muncul lebih dulu.
  language: python
  starter: |
    n = int(input())
    total = 0
    terlaris = ""
    jumlah_terbanyak = 0
    for _ in range(n):
        nama, jumlah, harga = input().split(",")
        # ubah jumlah dan harga menjadi angka,
        # lalu perbarui total dan menu terlaris
    # cetak laporan
  hint: Perbarui menu terlaris hanya jika jumlahnya lebih besar (bukan sama) dari yang tercatat.
  tests:
    - input: "3\nkopi susu,10,15000\nteh tarik,7,12000\nroti bakar,12,18000"
      output: "Total penjualan: Rp450000\nTerlaris: roti bakar"
    - input: "2\nkopi susu,5,15000\nteh tarik,5,12000"
      output: "Total penjualan: Rp135000\nTerlaris: kopi susu"
    - input: "1\nes jeruk,3,10000"
      output: "Total penjualan: Rp30000\nTerlaris: es jeruk"
  solution: |
    n = int(input())
    total = 0
    terlaris = ""
    jumlah_terbanyak = 0
    for _ in range(n):
        nama, jumlah, harga = input().split(",")
        jumlah = int(jumlah)
        harga = int(harga)
        total += jumlah * harga
        if jumlah > jumlah_terbanyak:
            jumlah_terbanyak = jumlah
            terlaris = nama
    print(f"Total penjualan: Rp{total}")
    print(f"Terlaris: {terlaris}")

- slug: quiz-return
  type: choice
  title: print atau return
  prompt: Apa bedanya `print` dan `return` di dalam sebuah fungsi?
  options:
    - "Tidak ada bedanya, keduanya menampilkan hasil"
    - "`return` mengirim nilai ke kode yang memanggil, sedangkan `print` hanya menampilkannya di layar"
    - "`print` mengirim nilai ke pemanggil, sedangkan `return` menampilkannya di layar"
    - "`return` hanya boleh dipakai sekali di seluruh program"
  correct: [1]
  hint: Hasil dari fungsi bisa disimpan di variabel hanya jika fungsi itu mengembalikannya.
  explanation: "`return` mengembalikan nilai ke pemanggil sehingga bisa disimpan atau dihitung lagi. `print` hanya menulis ke layar dan tidak menghasilkan nilai untuk dipakai."
