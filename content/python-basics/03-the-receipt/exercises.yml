- slug: print-the-receipt
  type: code
  title: Cetak struk
  prompt: |
    Baca nama pelanggan, nama item, harga, dan jumlah (empat baris). Cetak struk tiga baris dengan format persis seperti contoh di materi:

    ```
    Struk untuk Budi
    2 x Kopi Susu @ Rp15000
    Total: Rp30000
    ```
  language: python
  starter: |
    nama = input()
    item = input()
    harga = int(input())
    jumlah = int(input())
    # cetak struk di bawah ini
  hint: Pakai f-string, dan hitung total langsung di dalam kurung kurawal atau simpan dulu di variabel.
  tests:
    - input: "Budi\nKopi Susu\n15000\n2"
      output: "Struk untuk Budi\n2 x Kopi Susu @ Rp15000\nTotal: Rp30000"
    - input: "Siti\nRoti Bakar\n18000\n1"
      output: "Struk untuk Siti\n1 x Roti Bakar @ Rp18000\nTotal: Rp18000"
  solution: |
    nama = input()
    item = input()
    harga = int(input())
    jumlah = int(input())
    print(f"Struk untuk {nama}")
    print(f"{jumlah} x {item} @ Rp{harga}")
    print(f"Total: Rp{harga * jumlah}")

- slug: quiz-fstring
  type: choice
  title: Apa yang tampil?
  prompt: |
    Apa yang tampil di layar?

    ```python
    x = 3
    print(f"{x + 1} cangkir")
    ```
  options:
    - "`{x + 1} cangkir`"
    - "`4 cangkir`"
    - "`3 cangkir`"
    - "Error, karena ada kurung kurawal"
  correct: [1]
  hint: Yang ada di dalam kurung kurawal dihitung dulu.
  explanation: Di dalam f-string, isi kurung kurawal dihitung lalu dimasukkan ke teks. `3 + 1` hasilnya `4`.

- slug: quiz-input-type
  type: choice
  title: Tipe dari input
  prompt: Apa tipe data hasil dari `input()`?
  options:
    - "`str` (teks), apa pun yang diketik"
    - "`int`, karena yang diketik angka"
    - "`float`, karena bisa desimal"
    - "Tergantung apa yang diketik pengguna"
  correct: [0]
  explanation: "`input()` selalu menghasilkan teks. Itu sebabnya kita memakai `int()` untuk mengubahnya menjadi angka."
