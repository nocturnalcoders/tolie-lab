- slug: paying-with-a-member-discount
  type: code
  title: Paying with a member discount
  prompt: |
    Write a function `amount_to_pay(total, discount_percent=0)` that returns the amount to pay after taking that many percent off (rounded down).

    The program below it reads the total and the kind of customer (`member` or `regular`). Members get 10% off, regular customers call the function with no discount. The result is printed as `Pay: Rp<amount>`.
  language: python
  starter: |
    def amount_to_pay(total):
        # add a discount_percent parameter with a default of 0,
        # then return the total after the discount
        return total


    total = int(input())
    kind = input()
    if kind == "member":
        pay = amount_to_pay(total, 10)
    else:
        pay = amount_to_pay(total)
    print(f"Pay: Rp{pay}")
  hints:
    - "The program calls the function in two ways: with one value and with two. Both must work, so the second parameter needs a default value."
    - "Change the def line to `def amount_to_pay(total, discount_percent=0):`. What gets paid is (100 - discount_percent) percent of the total."
    - "The function body: `return total * (100 - discount_percent) // 100`."
  tests:
    - input: "50000\nregular"
      output: "Pay: Rp50000"
    - input: "50000\nmember"
      output: "Pay: Rp45000"
    - input: "99999\nmember"
      output: "Pay: Rp89999"
    - input: "0\nmember"
      output: "Pay: Rp0"
  solution: |
    def amount_to_pay(total, discount_percent=0):
        return total * (100 - discount_percent) // 100


    total = int(input())
    kind = input()
    if kind == "member":
        pay = amount_to_pay(total, 10)
    else:
        pay = amount_to_pay(total)
    print(f"Pay: Rp{pay}")

- slug: a-receipt-line
  type: code
  title: A receipt line
  prompt: |
    The functions `subtotal` and `rupiah` are already there. Write a function `receipt_line(name, price, quantity=1)` that uses both and returns text like `milk coffee x2 = Rp30.000`.

    The program reads a name, a price and a quantity, then prints two lines: the receipt line for that quantity, and the receipt line without giving a quantity (so it uses the default `1`).
  language: python
  starter: |
    def subtotal(price, quantity):
        return price * quantity


    def rupiah(amount):
        return "Rp" + f"{amount:,}".replace(",", ".")


    # write the receipt_line function here


    name = input()
    price = int(input())
    quantity = int(input())
    print(receipt_line(name, price, quantity))
    print(receipt_line(name, price))
  hints:
    - "Your function does not need to calculate anything itself. Call `subtotal` for the number, then `rupiah` for the text."
    - "The program's second line calls `receipt_line(name, price)` with no quantity, so the `quantity` parameter needs a default: `def receipt_line(name, price, quantity=1):`."
    - "The function body: `return f\"{name} x{quantity} = {rupiah(subtotal(price, quantity))}\"`."
  tests:
    - input: "milk coffee\n15000\n2"
      output: "milk coffee x2 = Rp30.000\nmilk coffee x1 = Rp15.000"
    - input: "toast\n18000\n10"
      output: "toast x10 = Rp180.000\ntoast x1 = Rp18.000"
    - input: "pulled tea\n12000\n100"
      output: "pulled tea x100 = Rp1.200.000\npulled tea x1 = Rp12.000"
    - input: "crackers\n500\n1"
      output: "crackers x1 = Rp500\ncrackers x1 = Rp500"
  solution: |
    def subtotal(price, quantity):
        return price * quantity


    def rupiah(amount):
        return "Rp" + f"{amount:,}".replace(",", ".")


    def receipt_line(name, price, quantity=1):
        return f"{name} x{quantity} = {rupiah(subtotal(price, quantity))}"


    name = input()
    price = int(input())
    quantity = int(input())
    print(receipt_line(name, price, quantity))
    print(receipt_line(name, price))

- slug: default-values
  type: choice
  title: Default values
  prompt: |
    What is shown after this code runs?

    ```python
    def greet(name, greeting="Hello"):
        return f"{greeting}, {name}!"

    print(greet("Budi"))
    ```
  options:
    - "`Hello, Budi!`"
    - "`Budi, Hello!`"
    - "`None, Budi!`"
    - "An error, because `greeting` was not given"
  correct: [0]
  hint: Look at what happens to a parameter that is left out when the function is called.
  explanation: "`greeting` has the default value `\"Hello\"`. The caller only passes `\"Budi\"`, so the default is used and the result is `Hello, Budi!`."
