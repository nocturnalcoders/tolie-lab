- slug: a-safe-quantity
  type: code
  title: Jumlah yang aman
  prompt: |
    Kasir mengetik jumlah pesanan. Baca satu baris, lalu cetak salah satu dari tiga hasil ini:

    - `Jumlah: <angka>` jika isinya angka bulat lebih dari 0
    - `Jumlah harus lebih dari 0` jika isinya angka bulat 0 atau negatif
    - `Bukan angka` jika isinya tidak bisa diubah menjadi angka bulat
  language: python
  starter: |
    teks = input()
    jumlah = int(teks)   # baris ini bisa gagal
    print(f"Jumlah: {jumlah}")
  hints:
    - "Ada dua macam masalah: teks yang bukan angka (ditangkap dengan try/except) dan angka yang tidak masuk akal (diperiksa dengan if)."
    - "Masukkan `int(teks)` ke dalam `try`, dan cetak `Bukan angka` di bagian `except ValueError:`."
    - "Masih di dalam `try`, setelah `jumlah = int(teks)`: `if jumlah <= 0:` cetak pesan harus lebih dari 0, `else:` cetak `f\"Jumlah: {jumlah}\"`."
  tests:
    - input: "3"
      output: "Jumlah: 3"
    - input: "dua"
      output: "Bukan angka"
    - input: "0"
      output: "Jumlah harus lebih dari 0"
    - input: "-4"
      output: "Jumlah harus lebih dari 0"
    - input: "2.5"
      output: "Bukan angka"
  solution: |
    teks = input()
    try:
        jumlah = int(teks)
        if jumlah <= 0:
            print("Jumlah harus lebih dari 0")
        else:
            print(f"Jumlah: {jumlah}")
    except ValueError:
        print("Bukan angka")

- slug: skip-the-broken-rows
  type: code
  title: Lewati baris rusak
  prompt: |
    Baris pertama berisi `n`, lalu `n` baris yang seharusnya berformat `nama,jumlah,harga`. Sebagian baris rusak: angkanya salah ketik atau kolomnya tidak lengkap.

    Jumlahkan hanya baris yang sah, lewati yang rusak, lalu cetak:

    ```
    Total: Rp<jumlah dikali harga dari semua baris sah>
    Baris dilewati: <banyaknya baris rusak>
    ```
  language: python
  starter: |
    n = int(input())
    total = 0
    dilewati = 0
    for _ in range(n):
        nama, jumlah, harga = input().split(",")
        total += int(jumlah) * int(harga)
    print(f"Total: Rp{total}")
    print(f"Baris dilewati: {dilewati}")
  hints:
    - "Kode awal sudah benar untuk data yang rapi. Yang kurang hanya perlindungan saat satu baris gagal dibaca."
    - "Bungkus dua baris di dalam perulangan dengan `try:`. Baris yang kolomnya kurang dan baris yang angkanya salah sama-sama menimbulkan `ValueError`."
    - "Di bawah `try`, sejajar dengannya, tulis `except ValueError:` lalu `dilewati += 1`. Total hanya bertambah jika seluruh baris berhasil dibaca."
  tests:
    - input: "3\nkopi susu,2,15000\nteh tarik,dua,12000\nroti bakar,1,18000"
      output: "Total: Rp48000\nBaris dilewati: 1"
    - input: "2\nkopi susu,1,15000\nes jeruk,3,10000"
      output: "Total: Rp45000\nBaris dilewati: 0"
    - input: "3\nroti bakar,2\nkopi susu,2,15000\nes jeruk,1,sepuluh ribu"
      output: "Total: Rp30000\nBaris dilewati: 2"
    - input: "2\n???\nteh tarik,,12000"
      output: "Total: Rp0\nBaris dilewati: 2"
  solution: |
    n = int(input())
    total = 0
    dilewati = 0
    for _ in range(n):
        try:
            nama, jumlah, harga = input().split(",")
            total += int(jumlah) * int(harga)
        except ValueError:
            dilewati += 1
    print(f"Total: Rp{total}")
    print(f"Baris dilewati: {dilewati}")

- slug: the-flow-of-try-and-except
  type: choice
  title: Alur try dan except
  prompt: |
    Apa yang tampil setelah kode ini dijalankan?

    ```python
    try:
        jumlah = int("tiga")
        print("A")
    except ValueError:
        print("B")
    print("C")
    ```
  options:
    - "`A`, lalu `C`"
    - "`B`, lalu `C`"
    - "`A`, `B`, lalu `C`"
    - "Hanya `B`"
  correct: [1]
  hint: Begitu satu baris di dalam try gagal, sisa blok try dilewati.
  explanation: "`int(\"tiga\")` gagal, jadi `print(\"A\")` tidak pernah dijalankan dan Python melompat ke `except`, yang mencetak `B`. Setelah itu program lanjut seperti biasa dan mencetak `C`."
