- slug: a-safe-quantity
  type: code
  title: A safe quantity
  prompt: |
    The cashier types in an order quantity. Read one line, then print one of these three results:

    - `Quantity: <number>` if it is a whole number greater than 0
    - `Quantity must be more than 0` if it is a whole number that is 0 or negative
    - `Not a number` if it cannot be turned into a whole number
  language: python
  starter: |
    text = input()
    quantity = int(text)   # this line can fail
    print(f"Quantity: {quantity}")
  hints:
    - "There are two kinds of problem: text that is not a number (caught with try/except) and a number that makes no sense (checked with if)."
    - "Move `int(text)` inside a `try`, and print `Not a number` in the `except ValueError:` part."
    - "Still inside the `try`, after `quantity = int(text)`: `if quantity <= 0:` print the must-be-more-than-0 message, `else:` print `f\"Quantity: {quantity}\"`."
  tests:
    - input: "3"
      output: "Quantity: 3"
    - input: "two"
      output: "Not a number"
    - input: "0"
      output: "Quantity must be more than 0"
    - input: "-4"
      output: "Quantity must be more than 0"
    - input: "2.5"
      output: "Not a number"
  solution: |
    text = input()
    try:
        quantity = int(text)
        if quantity <= 0:
            print("Quantity must be more than 0")
        else:
            print(f"Quantity: {quantity}")
    except ValueError:
        print("Not a number")

- slug: skip-the-broken-rows
  type: code
  title: Skip the broken rows
  prompt: |
    The first line holds `n`, then `n` lines that should be in the format `name,quantity,price`. Some rows are broken: a number was mistyped or a column is missing.

    Add up only the valid rows, skip the broken ones, then print:

    ```
    Total: Rp<quantity times price over all valid rows>
    Rows skipped: <number of broken rows>
    ```
  language: python
  starter: |
    n = int(input())
    total = 0
    skipped = 0
    for _ in range(n):
        name, quantity, price = input().split(",")
        total += int(quantity) * int(price)
    print(f"Total: Rp{total}")
    print(f"Rows skipped: {skipped}")
  hints:
    - "The starter code is already right for tidy data. All that is missing is protection for when one row fails to read."
    - "Wrap the two lines inside the loop in a `try:`. A row with too few columns and a row with a bad number both raise a `ValueError`."
    - "Below the `try`, lined up with it, write `except ValueError:` and then `skipped += 1`. The total only grows when the whole row was read successfully."
  tests:
    - input: "3\nmilk coffee,2,15000\npulled tea,two,12000\ntoast,1,18000"
      output: "Total: Rp48000\nRows skipped: 1"
    - input: "2\nmilk coffee,1,15000\norange juice,3,10000"
      output: "Total: Rp45000\nRows skipped: 0"
    - input: "3\ntoast,2\nmilk coffee,2,15000\norange juice,1,ten thousand"
      output: "Total: Rp30000\nRows skipped: 2"
    - input: "2\n???\npulled tea,,12000"
      output: "Total: Rp0\nRows skipped: 2"
  solution: |
    n = int(input())
    total = 0
    skipped = 0
    for _ in range(n):
        try:
            name, quantity, price = input().split(",")
            total += int(quantity) * int(price)
        except ValueError:
            skipped += 1
    print(f"Total: Rp{total}")
    print(f"Rows skipped: {skipped}")

- slug: the-flow-of-try-and-except
  type: choice
  title: The flow of try and except
  prompt: |
    What is shown after this code runs?

    ```python
    try:
        quantity = int("three")
        print("A")
    except ValueError:
        print("B")
    print("C")
    ```
  options:
    - "`A`, then `C`"
    - "`B`, then `C`"
    - "`A`, `B`, then `C`"
    - "Only `B`"
  correct: [1]
  hint: As soon as one line inside try fails, the rest of the try block is skipped.
  explanation: "`int(\"three\")` fails, so `print(\"A\")` never runs and Python jumps to `except`, which prints `B`. After that the program carries on as usual and prints `C`."
