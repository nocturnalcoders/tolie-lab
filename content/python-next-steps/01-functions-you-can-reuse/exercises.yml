- slug: a-subtotal-function
  type: code
  title: Fungsi subtotal
  prompt: |
    Tulis fungsi `subtotal(harga, jumlah)` yang mengembalikan harga dikali jumlah. Program di bawahnya sudah membaca harga dan jumlah, lalu mencetak `Subtotal: Rp<hasil>`.
  language: python
  starter: |
    def subtotal(harga, jumlah):
        # kembalikan harga dikali jumlah
        pass


    harga = int(input())
    jumlah = int(input())
    print(f"Subtotal: Rp{subtotal(harga, jumlah)}")
  hints:
    - "Fungsi ini hanya perlu satu baris: hitung hasilnya lalu kirim ke pemanggil."
    - "Kalau yang tampil `RpNone`, artinya fungsimu belum mengembalikan apa pun. Pakai return, bukan print."
    - "Ganti `pass` dengan `return harga * jumlah`."
  tests:
    - input: "15000\n2"
      output: "Subtotal: Rp30000"
    - input: "12000\n1"
      output: "Subtotal: Rp12000"
    - input: "10000\n7"
      output: "Subtotal: Rp70000"
    - input: "18000\n0"
      output: "Subtotal: Rp0"
  solution: |
    def subtotal(harga, jumlah):
        return harga * jumlah


    harga = int(input())
    jumlah = int(input())
    print(f"Subtotal: Rp{subtotal(harga, jumlah)}")

- slug: rupiah-format
  type: code
  title: Format rupiah
  prompt: |
    Tulis fungsi `rupiah(angka)` yang mengembalikan teks berawalan `Rp` dengan titik sebagai pemisah ribuan, misalnya `rupiah(1250000)` menghasilkan `Rp1.250.000`.

    Program membaca harga dan jumlah, lalu mencetak dua baris:

    ```
    Harga: <harga dalam format rupiah>
    Total: <harga dikali jumlah dalam format rupiah>
    ```
  language: python
  starter: |
    def rupiah(angka):
        # kembalikan teks seperti Rp1.250.000
        pass


    harga = int(input())
    jumlah = int(input())
    # cetak baris Harga dan baris Total memakai rupiah()
  hints:
    - "`f\"{angka:,}\"` menghasilkan teks dengan koma sebagai pemisah ribuan. Tinggal tukar komanya dan tambahkan `Rp` di depan."
    - "Isi fungsinya: `return \"Rp\" + f\"{angka:,}\".replace(\",\", \".\")`. Setelah itu panggil `rupiah` dua kali, sekali untuk harga dan sekali untuk harga dikali jumlah."
    - "Baris pertama: `print(f\"Harga: {rupiah(harga)}\")`. Baris kedua sama, tetapi yang dikirim ke `rupiah` adalah `harga * jumlah`."
  tests:
    - input: "15000\n2"
      output: "Harga: Rp15.000\nTotal: Rp30.000"
    - input: "500\n1"
      output: "Harga: Rp500\nTotal: Rp500"
    - input: "25000\n50"
      output: "Harga: Rp25.000\nTotal: Rp1.250.000"
    - input: "18000\n0"
      output: "Harga: Rp18.000\nTotal: Rp0"
  solution: |
    def rupiah(angka):
        return "Rp" + f"{angka:,}".replace(",", ".")


    harga = int(input())
    jumlah = int(input())
    print(f"Harga: {rupiah(harga)}")
    print(f"Total: {rupiah(harga * jumlah)}")

- slug: a-function-without-return
  type: choice
  title: Fungsi tanpa return
  prompt: |
    Apa yang tampil setelah kode ini dijalankan?

    ```python
    def tambah(a, b):
        a + b

    print(tambah(2, 3))
    ```
  options:
    - "`5`"
    - "`None`"
    - "`23`"
    - "Tidak ada, kodenya error"
  correct: [1]
  hint: Perhatikan apakah fungsi itu mengirim hasilnya ke pemanggil.
  explanation: "Fungsi itu menghitung `a + b` tetapi tidak pernah mengembalikannya. Fungsi tanpa `return` menghasilkan `None`, jadi itulah yang dicetak."
