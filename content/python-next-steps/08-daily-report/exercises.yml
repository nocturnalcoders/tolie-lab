- slug: parse-transaction
  type: code
  title: Parse a transaction
  prompt: |
    Write a function `parse(row)` for rows in the format `customer,item,quantity`.

    For a valid row, return a dictionary with the keys `customer` (tidied with `.strip().title()`), `item` (tidied with `.strip().lower()`) and `quantity` (a number). Return `None` if the row is broken: it does not have three columns, the quantity is not a number, the quantity is 0 or less, or the item is not in `PRICES`.

    The program below it already prints each valid transaction and counts the valid and broken rows.
  language: python
  starter: |
    PRICES = {"milk coffee": 15000, "pulled tea": 12000, "toast": 18000, "orange juice": 10000}


    def parse(row):
        # return a dictionary for a valid row, None for a broken row
        pass


    n = int(input())
    valid = 0
    broken = 0
    for _ in range(n):
        t = parse(input())
        if t is None:
            broken += 1
        else:
            valid += 1
            print(f"{t['customer']} | {t['item']} | {t['quantity']}")
    print(f"Valid rows: {valid}")
    print(f"Broken rows: {broken}")
  hints:
    - "Do the checking in two layers. First, the things that can raise an error (splitting into three columns and `int`), inside try/except. Second, the things checked with `if` (the quantity and the item)."
    - "Inside the `try`: `customer, item, quantity = row.split(\",\")` then `quantity = int(quantity)`. In `except ValueError:` write `return None`."
    - "After the try/except: `item = item.strip().lower()`. If `quantity <= 0 or item not in PRICES`, `return None`. Otherwise return `{\"customer\": customer.strip().title(), \"item\": item, \"quantity\": quantity}`."
  tests:
    - input: "4\nsiti,milk coffee,2\nBudi, Toast ,1\nagus,pulled tea,two\n dewi ,orange juice,3"
      output: "Siti | milk coffee | 2\nBudi | toast | 1\nDewi | orange juice | 3\nValid rows: 3\nBroken rows: 1"
    - input: "3\nsiti,fried rice,1\nbudi,milk coffee,0\nrina,MILK COFFEE,4"
      output: "Rina | milk coffee | 4\nValid rows: 1\nBroken rows: 2"
    - input: "3\nbudi,pulled tea\nbudi santoso,pulled tea,1\nagus,orange juice,-2"
      output: "Budi Santoso | pulled tea | 1\nValid rows: 1\nBroken rows: 2"
    - input: "2\n???\nsiti,milk coffee,1,15000"
      output: "Valid rows: 0\nBroken rows: 2"
  solution: |
    PRICES = {"milk coffee": 15000, "pulled tea": 12000, "toast": 18000, "orange juice": 10000}


    def parse(row):
        try:
            customer, item, quantity = row.split(",")
            quantity = int(quantity)
        except ValueError:
            return None
        item = item.strip().lower()
        if quantity <= 0 or item not in PRICES:
            return None
        return {"customer": customer.strip().title(), "item": item, "quantity": quantity}


    n = int(input())
    valid = 0
    broken = 0
    for _ in range(n):
        t = parse(input())
        if t is None:
            broken += 1
        else:
            valid += 1
            print(f"{t['customer']} | {t['item']} | {t['quantity']}")
    print(f"Valid rows: {valid}")
    print(f"Broken rows: {broken}")

- slug: revenue-per-item
  type: code
  title: Revenue per item
  prompt: |
    The functions `parse` and `rupiah` are already there, and the starter code already collects the valid transactions into the list `transactions`.

    Work out the revenue of each item (quantity times its price from `PRICES`, added up for the same item). Print one line `<item>: <revenue in rupiah format>` for each item that was sold, **largest** revenue first. If two revenues are equal, put them in alphabetical order. The last line: `Revenue: <sum of them all in rupiah format>`.

    If there are no valid transactions, just print `Revenue: Rp0`.
  language: python
  starter: |
    PRICES = {"milk coffee": 15000, "pulled tea": 12000, "toast": 18000, "orange juice": 10000}


    def rupiah(amount):
        return "Rp" + f"{amount:,}".replace(",", ".")


    def parse(row):
        try:
            customer, item, quantity = row.split(",")
            quantity = int(quantity)
        except ValueError:
            return None
        item = item.strip().lower()
        if quantity <= 0 or item not in PRICES:
            return None
        return {"customer": customer.strip().title(), "item": item, "quantity": quantity}


    n = int(input())
    transactions = []
    for _ in range(n):
        t = parse(input())
        if t is not None:
            transactions.append(t)

    # work out the revenue per item, print from the largest, then print the total
  hints:
    - "Use the tally pattern from the previous lesson, but instead of adding 1, add the value of the transaction: `revenue[item] = revenue.get(item, 0) + value`."
    - "The value of one transaction is `t[\"quantity\"] * PRICES[t[\"item\"]]`. Add that value to `revenue[t[\"item\"]]` and also to a `total` variable."
    - "For the order, make a function `ranking(pair)` that returns `(-value, name)` as in the lesson, then `for name, value in sorted(revenue.items(), key=ranking):` and print `f\"{name}: {rupiah(value)}\"`. Last, print `f\"Revenue: {rupiah(total)}\"`."
  tests:
    - input: "5\nsiti,milk coffee,2\nbudi,toast,1\nsiti,milk coffee,1\nagus,pulled tea,two\ndewi,orange juice,3"
      output: "milk coffee: Rp45.000\norange juice: Rp30.000\ntoast: Rp18.000\nRevenue: Rp93.000"
    - input: "3\nsiti,pulled tea,5\nbudi,milk coffee,4\nrina,orange juice,6"
      output: "milk coffee: Rp60.000\norange juice: Rp60.000\npulled tea: Rp60.000\nRevenue: Rp180.000"
    - input: "1\nRina, Toast ,100"
      output: "toast: Rp1.800.000\nRevenue: Rp1.800.000"
    - input: "2\nsiti,fried rice,1\nbudi,milk coffee,x"
      output: "Revenue: Rp0"
  solution: |
    PRICES = {"milk coffee": 15000, "pulled tea": 12000, "toast": 18000, "orange juice": 10000}


    def rupiah(amount):
        return "Rp" + f"{amount:,}".replace(",", ".")


    def parse(row):
        try:
            customer, item, quantity = row.split(",")
            quantity = int(quantity)
        except ValueError:
            return None
        item = item.strip().lower()
        if quantity <= 0 or item not in PRICES:
            return None
        return {"customer": customer.strip().title(), "item": item, "quantity": quantity}


    def ranking(pair):
        name, value = pair
        return (-value, name)


    n = int(input())
    transactions = []
    for _ in range(n):
        t = parse(input())
        if t is not None:
            transactions.append(t)

    revenue = {}
    total = 0
    for t in transactions:
        value = t["quantity"] * PRICES[t["item"]]
        revenue[t["item"]] = revenue.get(t["item"], 0) + value
        total += value

    for name, value in sorted(revenue.items(), key=ranking):
        print(f"{name}: {rupiah(value)}")
    print(f"Revenue: {rupiah(total)}")

- slug: daily-report
  type: code
  title: "Project: the daily report"
  prompt: |
    The first line holds `n`, then `n` raw rows in the format `customer,item,quantity`. The functions `parse` and `rupiah` are already there. Print a five-line report:

    ```
    Valid transactions: <number of valid rows>
    Broken rows: <number of broken rows>
    Revenue: <quantity times price over all valid rows, in rupiah format>
    Unique customers: <number of different customers in the valid rows>
    Best seller: <item with the most units sold> (<that number>)
    ```

    If two items sold the same number, pick the one that comes first alphabetically. If there are no valid transactions, the last line becomes `Best seller: -`.
  language: python
  starter: |
    PRICES = {"milk coffee": 15000, "pulled tea": 12000, "toast": 18000, "orange juice": 10000}


    def rupiah(amount):
        return "Rp" + f"{amount:,}".replace(",", ".")


    def parse(row):
        try:
            customer, item, quantity = row.split(",")
            quantity = int(quantity)
        except ValueError:
            return None
        item = item.strip().lower()
        if quantity <= 0 or item not in PRICES:
            return None
        return {"customer": customer.strip().title(), "item": item, "quantity": quantity}


    n = int(input())
    valid = 0
    broken = 0
    for _ in range(n):
        t = parse(input())
        # count the valid and broken rows, then collect the revenue,
        # the customers (a set) and the units sold per item (a dictionary)

    # print the five lines of the report
  hints:
    - "Set up the containers before the loop: `revenue = 0`, `customers = set()` and `sold = {}`. Inside the loop, a row that is `None` only adds to `broken`. A valid row fills all the containers."
    - "For a valid row: `valid += 1`, `revenue += t[\"quantity\"] * PRICES[t[\"item\"]]`, `customers.add(t[\"customer\"])`, and `sold[t[\"item\"]] = sold.get(t[\"item\"], 0) + t[\"quantity\"]`."
    - "For the best seller, start from `best = \"-\"` and `most = 0`, then loop `for item in sorted(sold):` and update both only if `sold[item] > most`. Print `Best seller: -` if `most` is still 0, otherwise `f\"Best seller: {best} ({most})\"`."
  tests:
    - input: "5\nsiti,milk coffee,2\nbudi,toast,1\n SITI ,Milk Coffee,1\nagus,pulled tea,two\ndewi,orange juice,2"
      output: "Valid transactions: 4\nBroken rows: 1\nRevenue: Rp83.000\nUnique customers: 3\nBest seller: milk coffee (3)"
    - input: "4\nrina,pulled tea,3\nbudi,orange juice,3\nrina,toast,1\nbudi,milk coffee,2"
      output: "Valid transactions: 4\nBroken rows: 0\nRevenue: Rp114.000\nUnique customers: 2\nBest seller: orange juice (3)"
    - input: "6\nsiti,milk coffee,1\nbudi,milk coffee,1\nagus,milk coffee,1\nsiti,pulled tea,2\ndewi,toast,0\nsiti,orange juice,1"
      output: "Valid transactions: 5\nBroken rows: 1\nRevenue: Rp79.000\nUnique customers: 3\nBest seller: milk coffee (3)"
    - input: "1\nbudi santoso,toast,100"
      output: "Valid transactions: 1\nBroken rows: 0\nRevenue: Rp1.800.000\nUnique customers: 1\nBest seller: toast (100)"
    - input: "2\nsiti,fried rice,1\n???"
      output: "Valid transactions: 0\nBroken rows: 2\nRevenue: Rp0\nUnique customers: 0\nBest seller: -"
  solution: |
    PRICES = {"milk coffee": 15000, "pulled tea": 12000, "toast": 18000, "orange juice": 10000}


    def rupiah(amount):
        return "Rp" + f"{amount:,}".replace(",", ".")


    def parse(row):
        try:
            customer, item, quantity = row.split(",")
            quantity = int(quantity)
        except ValueError:
            return None
        item = item.strip().lower()
        if quantity <= 0 or item not in PRICES:
            return None
        return {"customer": customer.strip().title(), "item": item, "quantity": quantity}


    n = int(input())
    valid = 0
    broken = 0
    revenue = 0
    customers = set()
    sold = {}
    for _ in range(n):
        t = parse(input())
        if t is None:
            broken += 1
        else:
            valid += 1
            revenue += t["quantity"] * PRICES[t["item"]]
            customers.add(t["customer"])
            sold[t["item"]] = sold.get(t["item"], 0) + t["quantity"]

    best = "-"
    most = 0
    for item in sorted(sold):
        if sold[item] > most:
            most = sold[item]
            best = item

    print(f"Valid transactions: {valid}")
    print(f"Broken rows: {broken}")
    print(f"Revenue: {rupiah(revenue)}")
    print(f"Unique customers: {len(customers)}")
    if most > 0:
        print(f"Best seller: {best} ({most})")
    else:
        print("Best seller: -")

- slug: quiz-two-rule-sort
  type: choice
  title: Sorting by two rules
  prompt: |
    In what order are the item names printed?

    ```python
    revenue = {"pulled tea": 60000, "toast": 90000, "milk coffee": 60000}

    def ranking(pair):
        name, value = pair
        return (-value, name)

    for name, value in sorted(revenue.items(), key=ranking):
        print(name)
    ```
  options:
    - "`pulled tea`, `toast`, `milk coffee`"
    - "`toast`, `pulled tea`, `milk coffee`"
    - "`toast`, `milk coffee`, `pulled tea`"
    - "`milk coffee`, `toast`, `pulled tea`"
  correct: [2]
  hint: The first value in the brackets is compared first. The second is only used when the first ones are equal.
  explanation: "The minus sign puts the largest revenue, `90000`, on top, so `toast` comes first. The other two items are both `60000`, so the name decides, alphabetically: `milk coffee` before `pulled tea`."
