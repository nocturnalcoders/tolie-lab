- slug: subtotal-function
  type: code
  title: A subtotal function
  prompt: |
    Write a function `subtotal(price, quantity)` that returns the price times the quantity. The program below it already reads the price and the quantity, then prints `Subtotal: Rp<result>`.
  language: python
  starter: |
    def subtotal(price, quantity):
        # return price times quantity
        pass


    price = int(input())
    quantity = int(input())
    print(f"Subtotal: Rp{subtotal(price, quantity)}")
  hints:
    - "This function only needs one line: work out the result and send it back to the caller."
    - "If you see `RpNone`, your function is not giving anything back yet. Use return, not print."
    - "Replace `pass` with `return price * quantity`."
  tests:
    - input: "15000\n2"
      output: "Subtotal: Rp30000"
    - input: "12000\n1"
      output: "Subtotal: Rp12000"
    - input: "10000\n7"
      output: "Subtotal: Rp70000"
    - input: "18000\n0"
      output: "Subtotal: Rp0"
  solution: |
    def subtotal(price, quantity):
        return price * quantity


    price = int(input())
    quantity = int(input())
    print(f"Subtotal: Rp{subtotal(price, quantity)}")

- slug: rupiah-format
  type: code
  title: Rupiah format
  prompt: |
    Write a function `rupiah(amount)` that returns text starting with `Rp` and using dots between the thousands, so `rupiah(1250000)` gives `Rp1.250.000`.

    The program reads a price and a quantity, then prints two lines:

    ```
    Price: <the price in rupiah format>
    Total: <price times quantity in rupiah format>
    ```
  language: python
  starter: |
    def rupiah(amount):
        # return text like Rp1.250.000
        pass


    price = int(input())
    quantity = int(input())
    # print the Price line and the Total line using rupiah()
  hints:
    - "`f\"{amount:,}\"` gives text with commas between the thousands. Swap the commas and put `Rp` in front."
    - "The function body: `return \"Rp\" + f\"{amount:,}\".replace(\",\", \".\")`. Then call `rupiah` twice, once for the price and once for price times quantity."
    - "First line: `print(f\"Price: {rupiah(price)}\")`. The second line is the same, but what you pass to `rupiah` is `price * quantity`."
  tests:
    - input: "15000\n2"
      output: "Price: Rp15.000\nTotal: Rp30.000"
    - input: "500\n1"
      output: "Price: Rp500\nTotal: Rp500"
    - input: "25000\n50"
      output: "Price: Rp25.000\nTotal: Rp1.250.000"
    - input: "18000\n0"
      output: "Price: Rp18.000\nTotal: Rp0"
  solution: |
    def rupiah(amount):
        return "Rp" + f"{amount:,}".replace(",", ".")


    price = int(input())
    quantity = int(input())
    print(f"Price: {rupiah(price)}")
    print(f"Total: {rupiah(price * quantity)}")

- slug: quiz-no-return
  type: choice
  title: A function without return
  prompt: |
    What is shown after this code runs?

    ```python
    def add(a, b):
        a + b

    print(add(2, 3))
    ```
  options:
    - "`5`"
    - "`None`"
    - "`23`"
    - "Nothing, the code has an error"
  correct: [1]
  hint: Check whether the function sends its result back to the caller.
  explanation: "The function works out `a + b` but never returns it. A function without `return` gives back `None`, so that is what gets printed."
